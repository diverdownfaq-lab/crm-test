<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSRC CRM</title>
<style>
:root{--bg:#0a0f1e;--panel:#111a2f;--panel2:#16213b;--line:#22304f;--text:#e7ecf6;--mut:#8796b6;--acc:#38d9c7;--acc2:#7d6bff;--warn:#ffb547;--bad:#ff5c74;--ok:#3ddc84;--r:14px;--sh:0 10px 30px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#eef2f8;--panel:#ffffff;--panel2:#f5f7fb;--line:#dde3ee;--text:#16203a;--mut:#66728c;--sh:0 8px 24px rgba(20,30,60,.08)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--acc)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent}
.grad{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* login */
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% 10%,rgba(125,107,255,.25),transparent),radial-gradient(900px 500px at 90% 90%,rgba(56,217,199,.18),transparent),var(--bg)}
.lcard{width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--sh)}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}
.demo{margin-top:18px;font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:12px}
.demo code{background:var(--panel2);padding:1px 6px;border-radius:6px;cursor:pointer}
/* shell */
#app{display:none;height:100vh;grid-template-columns:232px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside .logo{padding:4px 10px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mut);cursor:pointer;user-select:none}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:linear-gradient(135deg,rgba(56,217,199,.15),rgba(125,107,255,.15));color:var(--text);box-shadow:inset 2px 0 0 var(--acc)}
.nav .ic{width:18px;text-align:center}
.nav .bdg{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px}
.navsep{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);padding:14px 12px 4px;opacity:.7}
main{overflow:auto;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 26px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;font-weight:700}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;min-width:240px}
.kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:4px 14px 4px 4px;height:40px;cursor:pointer}.chip:hover{border-color:var(--acc)}
.tbtn{height:40px}
.chip{max-width:260px}.chip .cn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}.chip .cr{font-size:11px;white-space:nowrap}.chip .car{margin-left:2px;color:var(--mut);font-size:11px}
#umenu{position:absolute;right:0;top:48px;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:8px;display:none;z-index:40}
#umenu.on{display:block}#umenu .mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px}#umenu .mi:hover{background:var(--panel2)}
#umenu .ms{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:10px 10px 4px}#umenu hr{border:0;border-top:1px solid var(--line);margin:6px 0}.tbtn.ico{width:40px;justify-content:center;padding:0;font-size:16px}.tdiv{width:1px;height:26px;background:var(--line);margin:0 2px}
.ava{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc));flex:none}
.ava.s{width:22px;height:22px;font-size:10px}
.content{padding:22px 26px 60px}
/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:8px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.kpi{position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(125,107,255,.25),transparent 70%)}
.hello{font-size:24px;font-weight:700;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.funnel .row{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:12px;margin:8px 0;font-size:13px}
.bar{height:26px;border-radius:8px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;min-width:3px;transition:width .6s}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.list .it:last-child{border:0}
.mut{color:var(--mut)}.small{font-size:12px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(61,220,132,.35)}.tag.bad{color:var(--bad);border-color:rgba(255,92,116,.35)}.tag.warn{color:var(--warn);border-color:rgba(255,181,71,.35)}.tag.acc{color:var(--acc);border-color:rgba(56,217,199,.35)}
.empty{color:var(--mut);text-align:center;padding:24px;font-size:13px}
/* toolbar */
.tb{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.tb input,.tb select{width:auto;min-width:180px}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--panel2)}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;min-height:calc(100vh - 190px)}
.col{flex:0 0 260px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.col.over{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,217,199,.15)}
.colh{padding:12px 14px;border-bottom:1px solid var(--line)}
.colh b{display:flex;align-items:center;gap:8px}
.colh .dot{width:9px;height:9px;border-radius:50%}
.colh .mut{font-size:12px;margin-top:2px}
.cards{padding:10px;display:flex;flex-direction:column;gap:9px;flex:1;overflow:auto}
.deal{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:grab;transition:transform .1s}
.deal:hover{border-color:var(--acc);transform:translateY(-1px)}
.deal.drag{opacity:.4}
.deal[data-drag="1"]{touch-action:none;user-select:none;-webkit-user-select:none}.deal[data-drag="0"]{cursor:pointer}body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}
.deal .t{font-weight:600;font-size:13px;margin-bottom:3px}
.deal .c{font-size:12px;color:var(--mut)}
.deal .f{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:12px}
.deal .mv{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}.deal .mv .btn{padding:3px 8px;font-size:11px}
.deal .lock{font-size:11px;color:var(--warn);margin-top:6px}
/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(5,8,18,.55);backdrop-filter:blur(3px);z-index:50;display:none}
.ov.on{display:block}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(720px,96vw);background:var(--panel);border-left:1px solid var(--line);z-index:60;transform:translateX(105%);transition:transform .25s;overflow:auto;box-shadow:var(--sh)}
#drawer.on{transform:none}
.dh{padding:22px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dh h2{margin:0 0 6px;font-size:20px}
.db{padding:6px 24px 40px}
.sec{margin-top:22px}
.sec h4{margin:0 0 10px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px}
.sec h4 .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .e{position:relative;padding:6px 0 10px;font-size:13px}
.tl .e:before{content:"";position:absolute;left:-22px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 3px var(--panel)}
.tl .e.auto:before{background:var(--line)}
.tl .e .d{font-weight:600;margin-right:6px}
#modal{position:fixed;z-index:80;left:50%;top:7vh;transform:translateX(-50%);width:min(560px,94vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);display:none;padding:22px 24px}
#modal.on{display:block}
#modal h2{margin:0 0 6px;font-size:18px}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#mov{z-index:70}
/* palette */
#pal{position:fixed;z-index:90;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);display:none;overflow:hidden}
#pal.on{display:block}
#pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px;background:var(--panel)}
#palr{max-height:50vh;overflow:auto;padding:6px}
.pr{padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.pr.on,.pr:hover{background:var(--panel2)}
.pr .k{margin-left:auto;font-size:11px;color:var(--mut)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);padding:10px 16px;border-radius:10px;box-shadow:var(--sh);animation:up .25s}
.tst.bad{border-left-color:var(--bad)}.tst.warn{border-left-color:var(--warn)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.score{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:11px;font-weight:700}
.prog{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ro-note{background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.3);color:var(--warn);padding:8px 12px;border-radius:10px;font-size:12px;margin-bottom:14px}
.chk{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);display:inline-grid;place-items:center;cursor:pointer;flex:none;font-size:11px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.grp{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);display:flex;gap:8px;align-items:center}
#modal.wide{width:min(940px,96vw)}
.kbody{font-size:14px;line-height:1.65}.kbody h2{font-size:18px;margin:22px 0 8px}.kbody h3{font-size:17px;margin:22px 0 8px;color:var(--text);display:block;font-weight:700}.kbody h2{color:var(--text)}.kbody h4{color:var(--text)}.kbody h4{font-size:14px;margin:14px 0 4px}.kbody p{margin:8px 0}.kbody ul,.kbody ol{margin:8px 0;padding-left:22px}.kbody li{margin:3px 0}
.kbody .kbt{margin:10px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.kbody .kbt th{background:var(--panel2);color:var(--text);font-weight:600}.kbody .kbt td,.kbody .kbt th{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.kbnote{background:rgba(56,217,199,.08);border-left:3px solid var(--acc);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:13px}
.kbq{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:11px;color:var(--mut);cursor:pointer;font-weight:600}.kbq:hover{color:var(--acc);border-color:var(--acc)}
pre.spr{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;font:13px/1.55 "Segoe UI",system-ui,sans-serif;max-height:46vh;overflow:auto}
.pz{display:inline-block;width:3px;height:10px;border-left:3px solid currentColor;border-right:3px solid currentColor;box-sizing:content-box;vertical-align:-1px;margin-right:2px}
#burger{display:none}#sideov{display:none}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 aside#side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:70;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--sh)}
 body.navon aside#side{transform:none}body.navon #sideov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65}
 #burger{display:inline-grid}
 .top{padding:10px 12px;gap:8px;flex-wrap:wrap}.top h1{font-size:17px;flex:1}.top .search{display:none}.top .tdiv{display:none}.chip .cn,.chip .cr,.chip .car{display:none}
 .content{padding:12px!important}
 .g4,.g3,.g2,.r2{grid-template-columns:1fr!important}
 .kb{flex-direction:column;overflow-x:visible;min-height:0}.col{flex:none;width:100%}.col .deals{max-height:none}
 .tb{flex-wrap:wrap}.tb select,.tb input{max-width:100%}
 .tw{overflow-x:auto}
 #drawer{width:100vw}#modal{top:0;width:100vw;max-height:100vh;border-radius:0;padding:18px 16px}
 .hello{font-size:20px}
}
#srvdot{display:none;width:9px;height:9px;border-radius:50%;background:var(--ok)}body.srv #srvdot{display:inline-block}#srvdot[data-k=sync]{background:var(--warn)}#srvdot[data-k=off]{background:var(--bad)}
.kbtool{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;background:var(--panel2)}.kbtool select{width:auto;padding:4px 8px;font-size:12.5px}.kbtool+#kb_h+textarea,.kbtool+div+textarea{border-radius:0 0 10px 10px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="logo"><span class="grad">DSRC</span> CRM</div>
    <p class="mut" style="margin:6px 0 18px">Digital Silk Road Company · клиенты, сделки, договоры</p>
    <label>Логин</label><input id="lu" autocomplete="username">
    <label>Пароль</label><input id="lp" type="password" autocomplete="current-password">
    <div id="lerr" style="color:var(--bad);font-size:12px;min-height:18px;margin-top:8px"></div>
    <button class="btn pri" style="width:100%;justify-content:center;padding:11px" onclick="doLogin()">Войти</button>
    <div class="demo" id="demoHints"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside id="side"></aside><div id="sideov" onclick="document.body.classList.remove('navon')"></div>
  <main>
    <div class="top">
      <button class="btn ghost tbtn ico" id="burger" onclick="document.body.classList.toggle('navon')" title="Меню">☰</button>
      <h1 id="ptitle"></h1>
      <div class="search" onclick="openPal()">⌕ Поиск и команды <span class="kbd">Ctrl K</span></div>
      <select id="asSel" style="display:none" onchange="actAs(this.value)"></select>
      <span id="srvdot" title=""></span><span class="tdiv"></span>
      <div style="position:relative"><div class="chip" id="uchip" onclick="toggleUmenu(event)" title="Профиль и выход"></div><div id="umenu"></div></div>
      <button class="btn ghost tbtn ico" id="bell" onclick="openNotes()" title="Уведомления" style="position:relative"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button class="btn ghost tbtn ico" title="Светлая / темная тема" onclick="toggleTheme()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="ov" id="dov" onclick="closeDrawer()"></div>
<div id="drawer"></div>
<div class="ov" id="mov" onclick="closeModal()"></div>
<div id="modal"></div>
<div class="ov" id="pov" onclick="closePal()" style="z-index:85"></div>
<div id="pal"><input id="palq" placeholder="Клиент, сделка, раздел или команда..." oninput="palRender()" onkeydown="palKey(event)"><div id="palr"></div></div>
<div id="toast"></div>
<div id="ctip" style="position:fixed;z-index:120;display:none;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);border-radius:10px;padding:8px 12px;font-size:12px;max-width:250px"></div>

<script>
/* ================= ДАННЫЕ И КОНСТАНТЫ ================= */
const KEY='dsrc_crm_v1';
const STAGES=[
 {id:'lead',n:'Лид',p:5,c:'#8796b6'},
 {id:'qual',n:'Квалификация',p:15,c:'#5aa9ff'},
 {id:'kp',n:'КП направлено',p:30,c:'#38d9c7'},
 {id:'nego',n:'Переговоры',p:50,c:'#7d6bff'},
 {id:'tech',n:'Тех. соглашение',p:70,c:'#c46bff'},
 {id:'contract',n:'Договор',p:90,c:'#ffb547'},
 {id:'won',n:'Успешно',p:100,c:'#3ddc84'},
 {id:'lost',n:'Отказ',p:0,c:'#ff5c74'}];
const PAUSE={id:'pause',n:'В приостановлении',p:0,c:'#9aa6bf'};
const ROLES={owner:'Project Manager',admin:'Admin',super:'User-approver',user:'User',fin:'User-billing',guest:'Viewer'};
const NOWORK=['guest','fin'];const isFin=()=>ME?.role==='fin';const FINPAGES=['contracts','pays'];
const CSTAT={lead:'Лид',client:'Клиент',partner:'Партнер',lost:'Неактивен'};
const KSTAT={draft:'Проект',approval:'На согласовании',signed:'Подписан',done:'Исполнен',term:'Расторгнут'};
const SERVICES=['Передача данных','Интеграционное решение','Индивидуальная разработка','Аналитика / дашборды','Проверка контрагентов','Прочее'];
let S=null, ME=null, PAGE='dash';
const DEF_CHECKS={
 qual:['Определено контактное лицо клиента','Выявлена потребность клиента','Назначен ответственный в DSRC'],
 kp:['Подготовлено коммерческое предложение','КП направлено клиенту','Указана сумма сделки'],

async function api(path,opt={}){const o={credentials:'same-origin',method:opt.method||'GET',headers:{}};if(opt.body!==undefined){if(opt.raw){o.body=opt.body}else{o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.body)}}
 try{const r=await fetch(path,o);let j=null;try{j=await r.json()}catch(e){}return {ok:r.ok,status:r.status,j:j||{}}}catch(e){return {ok:false,status:0,j:{error:'Нет связи с сервером'}}}}
const jeq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&x.id!==undefined);
// трехстороннее слияние: base — последняя синхронизированная версия, m — моя, t — с сервера
function merge3(b,m,t){
 if(jeq(m,b))return t;if(jeq(t,b))return m;if(jeq(m,t))return m;
 if(idArr(m)&&idArr(t)&&(b===undefined||idArr(b))){
  const B=new Map((b||[]).map(x=>[x.id,x])),M=new Map(m.map(x=>[x.id,x])),T=new Map(t.map(x=>[x.id,x]));const out=[];
  t.forEach(tx=>{const id=tx.id,bx=B.get(id),mx=M.get(id);if(!M.has(id)){if(B.has(id)&&jeq(tx,bx))return;out.push(tx)}else out.push(B.has(id)?merge3(bx,mx,tx):mx)});
  const mine=m.filter(x=>!T.has(x.id)&&(!B.has(x.id)||!jeq(x,B.get(x.id))));
  const front=mine.filter(x=>m.indexOf(x)<m.length/2&&!B.has(x.id)),back=mine.filter(x=>!front.includes(x));
  return [...front,...out,...back];
 }
 if(isObj(m)&&isObj(t)){const o={};const ks=new Set([...Object.keys(t),...Object.keys(m)]);const bb=isObj(b)?b:{};
  ks.forEach(k=>{const hb=k in bb,hm=k in m,ht=k in t;if(!hm&&hb){if(ht&&!jeq(t[k],bb[k]))o[k]=t[k];return}if(!ht&&hb){if(hm&&!jeq(m[k],bb[k]))o[k]=m[k];return}
   if(!hm){o[k]=t[k];return}if(!ht){o[k]=m[k];return}o[k]=merge3(bb[k],m[k],t[k])});return o}
 return m;
}

function lcCell(c){const l=lastContact(c);if(!l)return '<span class="mut small">нет контактов</span>';const t=lcT();const col=l.days>t.bad?'var(--bad)':l.days>t.warn?'var(--warn)':'inherit';return `<span style="white-space:nowrap;color:${col};${l.days>t.warn?'font-weight:600':''}">${fd(l.date)} · ${l.days} дн.</span>`}
const activeClient=c=>S.deals.some(d=>d.clientId===c.id&&!d.paused&&!['lead','won','lost'].includes(d.stage));
function parseLine(l,sep){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}
// чтение файла: .xlsx (Excel) или .csv в UTF-8 / Windows-1251
async function unzipEntry(buf,name){const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
 let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);
 for(let k=0;k<n;k++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);const fn=new TextDecoder().decode(u.slice(p+46,p+46+nl));
  if(fn===name){const ln=dv.getUint16(off+26,true),lx=dv.getUint16(off+28,true);const data=u.slice(off+30+ln+lx,off+30+ln+lx+cs);if(m===0)return new TextDecoder().decode(data);
   const st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(st).text()}
  p+=46+nl+xl+cl}return null}
async function readXlsx(buf){
 const ss=await unzipEntry(buf,'xl/sharedStrings.xml');const strs=[];
 if(ss){const d=new DOMParser().parseFromString(ss,'application/xml');[...d.getElementsByTagName('si')].forEach(si=>strs.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')))}
 const sh=await unzipEntry(buf,'xl/worksheets/sheet1.xml');if(!sh)throw new Error('sheet');
 const d=new DOMParser().parseFromString(sh,'application/xml');const rows=[];
 [...d.getElementsByTagName('row')].forEach(r=>{const row=[];[...r.getElementsByTagName('c')].forEach(c=>{const ref=c.getAttribute('r')||'';const col=ref.replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;const t=c.getAttribute('t');const v=c.getElementsByTagName('v')[0];let val='';
  if(t==='s'&&v)val=strs[+v.textContent]||'';else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(v)val=v.textContent;
  if(/^\d+(\.0+)?E\+?\d+$/i.test(val)||/^\d+\.0+$/.test(val))val=String(BigInt(Math.round(+val)));row[col>=0?col:row.length]=String(val).trim()});rows.push([...row].map(x=>x||''))});
 return rows.filter(r=>r.some(x=>x));
}
async function readTable(f){const buf=await f.arrayBuffer();const u=new Uint8Array(buf);
 if(u[0]===0x50&&u[1]===0x4b)return readXlsx(buf);
 let txt=new TextDecoder('utf-8').decode(buf);if(txt.includes('�'))txt=new TextDecoder('windows-1251').decode(buf);
 const lines=txt.replace(/^﻿/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return [];
 const sep=[';',',','\t'].sort((a,b)=>(lines[0].split(b).length)-(lines[0].split(a).length))[0];
 return lines.map(l=>parseLine(l,sep));
}
const IMP_COLS=[['name',['наимен','компан','организац','name']],['bin',['бин','bin','иин']],['industry',['отрасл','сектор','industry']],['status',['статус','status']],['region',['регион','город','region']],['owner',['ответствен','менеджер','owner']],['note',['замет','примеч','коммент','note']],['tags',['тег','метк','tag']]];
async function importCsv(inp){
 if(!canApprove())return toast('Импорт реестра доступен руководителям','bad');
 const f=inp.files[0];if(!f)return;inp.value='';
 let rows;try{rows=await readTable(f)}catch(e){return toast('Не удалось прочитать файл. Сохраните его как .xlsx или CSV.','bad')}
 if(!rows.length)return toast('Файл пустой','warn');
 const hdr=rows[0].map(x=>String(x).toLowerCase());const idx={};IMP_COLS.forEach(([k,ws])=>idx[k]=hdr.findIndex(h=>ws.some(w=>h.includes(w))));
 if(idx.name<0)return toast('Не найдена колонка «Наименование». Скачайте шаблон в разделе «Данные».','warn');
 const stMap={'лид':'lead','клиент':'client','партнер':'partner','партнёр':'partner','неактивен':'lost','неактивный':'lost'};
 const findUser=x=>{x=String(x||'').trim().toLowerCase();if(!x)return '';const u=S.users.find(u=>u.active&&!NOWORK.includes(u.role)&&(u.login.toLowerCase()===x||u.name.toLowerCase()===x||u.name.toLowerCase().split(' ')[0]===x));return u?u.id:null};
 const res={ok:0,dup:[],err:[]};const seen=new Set();
 rows.slice(1).forEach((rw,k)=>{const line=k+2;const g=key=>idx[key]>=0?String(rw[idx[key]]||'').trim().replace(/ё/g,'е').replace(/Ё/g,'Е'):'';
  const name=g('name');if(!name||/пример строки/i.test(g('note')))return;
  let bin=g('bin').replace(/\D/g,'');const probs=[];
  if(bin&&bin.length!==12){probs.push(`БИН «${g('bin')}» не 12 цифр — не записан`);bin=''}
  else if(bin&&!binOk(bin)){probs.push(`БИН «${bin}» не прошел проверку контрольной цифры — записан, проверьте`)}
  const key=name.toLowerCase();
  if(seen.has(key)||S.clients.some(c=>c.name.toLowerCase()===key||(bin&&c.bin===bin))){res.dup.push(`стр. ${line}: ${name}`);return}
  seen.add(key);
  const stRaw=g('status').toLowerCase();let status=stRaw?stMap[stRaw]:'lead';if(!status){probs.push(`статус «${g('status')}» не распознан — поставлен «Лид»`);status='lead'}
  let owner=findUser(g('owner'));if(owner===null){probs.push(`ответственный «${g('owner')}» не найден — не назначен`);owner=''}
  const id=uid();S.clients.push({id,name,bin,tags:parseTags(g('tags')),industry:g('industry'),region:g('region'),status,owner,source:'Импорт реестра',contacts:[],note:g('note'),createdAt:TODAY()});
  if(status==='lead')S.deals.push({id:uid(),title:'Первичный контакт',clientId:id,stage:'lead',amount:0,owner,service:'',createdAt:TODAY(),stageAt:TODAY(),next:''});
  if(owner)notify(owner,`${ME.name} назначил(а) вас ответственным по клиенту ${name} (импорт реестра)`,{client:id});
  res.ok++;if(probs.length)res.err.push(`стр. ${line}: ${name} — ${probs.join('; ')}`);
 });
 log('Импорт реестра',`Файл ${f.name}: добавлено ${res.ok}, дублей пропущено ${res.dup.length}, замечаний ${res.err.length}`);save();render();
 openModal('Импорт реестра',`<p>Добавлено клиентов: <b>${res.ok}</b></p>
  ${res.dup.length?`<p class="mut">Пропущены дубли (уже есть в CRM или повторяются в файле): ${res.dup.length}</p><div class="mut small" style="max-height:120px;overflow:auto">${res.dup.map(esc).join('<br>')}</div>`:''}
  ${res.err.length?`<p style="color:var(--warn);margin-top:12px">Добавлены с замечаниями: ${res.err.length}</p><div class="small" style="max-height:160px;overflow:auto">${res.err.map(esc).join('<br>')}</div>`:''}
  <p class="mut small" style="margin-top:12px">Колонки: ${IMP_COLS.map(([k])=>({name:'Наименование',bin:'БИН',industry:'Отрасль',status:'Статус',region:'Регион',owner:'Ответственный',note:'Заметки',tags:'Теги'})[k]+(idx[k]>=0?' ✓':' — нет')).join(' · ')}</p>`,null);
}

const reqName=r=>{if(r.type==='stage'){const d=D(r.entityId);return `возврат этапа «${d?.title||'—'}»`}const t=S.tasks.find(x=>x.id===r.entityId);return `${r.type==='priority'?'смена приоритета':'перенос срока'} задачи «${t?.title||'—'}»`};
function reqDesc(r){
 if(r.type==='stage'){const d=D(r.entityId);return `<b>Возврат этапа</b> · ${esc(C(d?.clientId)?.name)} — ${esc(d?.title)}<div class="mut small">«${st(r.from).n}» → «${st(r.to).n}»</div>`}
 const t=S.tasks.find(x=>x.id===r.entityId);
 if(r.type==='priority')return `<b>Смена приоритета задачи</b> · ${esc(t?.title)}<div class="mut small">«${PRN[r.from]}» → «${PRN[r.to]}»</div>`;
 return `<b>Перенос срока задачи</b> · ${esc(t?.title)}<div class="mut small">${fd(r.from)} → ${fd(r.to)}</div>`;
}
function rReq(){
 if(ro())return '<div class="empty">Раздел недоступен для роли Viewer</div>';
 const rs=S.requests.filter(r=>canApprove()||r.by===ME.id).sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.at.localeCompare(a.at));
 const mine=r=>canApprove()&&r.by!==ME.id;
 return `<p class="sub">Возврат сделки на предыдущий этап, перенос срока и смена приоритета задачи выполняются после решения Admin или User-approver (свой запрос согласовать нельзя). Ошибочное решение можно изменить — кнопкой «Изменить решение», с указанием причины.</p>
 <div class="tw"><table><tr><th>Запрос</th><th>Причина</th><th>Инициатор</th><th>Дата</th><th>Статус</th><th></th></tr>
 ${rs.map(r=>`<tr><td>${reqDesc(r)}</td><td>${esc(r.reason)}${r.comment?`<div class="mut small">Ответ: ${esc(r.comment)}</div>`:''}</td><td>${esc(uname(r.by))}</td><td>${fd(r.at)}</td>
 <td><span class="tag ${r.status==='approved'?'ok':r.status==='rejected'?'bad':'warn'}">${{pending:'ожидает',approved:'одобрено',rejected:'отклонено',cancelled:'неактуален'}[r.status]}</span>${r.resolver?`<div class="mut small">${esc(uname(r.resolver))}</div>`:''}${(r.history||[]).length?`<div class="small" style="color:var(--acc2)" title="${esc(r.history.map(h=>`${fd(h.at)} ${uname(h.by)}: ${h.status==='approved'?'одобрено':'отклонено'}`).join('\n'))}">решение менялось: ${r.history.length}</div>`:''}</td>
 <td>${r.status==='pending'&&mine(r)?`<div style="display:flex;gap:6px"><button class="btn sm pri" onclick="resolve('${r.id}',true)">Одобрить</button><button class="btn sm bad" onclick="resolve('${r.id}',false)">Отклонить</button></div>`:r.status!=='pending'&&r.status!=='cancelled'&&mine(r)?`<button class="btn sm" onclick="changeDecision('${r.id}')">Изменить решение</button>`:''}</td></tr>`).join('')}
 </table>${!rs.length?'<div class="empty">Запросов нет</div>':''}</div>`;
}
// применить / отменить эффект запроса
function applyReq(r){
 if(r.type==='stage'){const d=D(r.entityId);if(!d)return toast('Сделка удалена','bad'),false;if(d.stage!==r.from)return toast(`Сделка уже на этапе «${st(d.stage).n}» — применить нельзя`,'warn'),false;applyStage(d,r.to,r.reason,'',true,r.id);return true}
 const t=S.tasks.find(x=>x.id===r.entityId);if(!t)return toast('Задача удалена','bad'),false;
 if(r.type==='deadline'){taskMoved(t,t.deadline,r.to);t.deadline=r.to}
 if(r.type==='priority'){t.priority=r.to;t.slaDue=slaDate(t.createdAt||TODAY(),r.to)}
 return true;
}
function revertReq(r){
 if(r.type==='stage'){const d=D(r.entityId);if(!d)return toast('Сделка удалена','bad'),false;if(d.stage!==r.to)return toast(`Сделка уже на этапе «${st(d.stage).n}» — отменить нельзя`,'warn'),false;
  d.stage=r.from;d.stageAt=TODAY();addEvent(d.clientId,d.id,`решение по возврату изменено: сделка «${d.title}» возвращена на этап «${st(r.from).n}».`,true);return true}
 const t=S.tasks.find(x=>x.id===r.entityId);if(!t)return toast('Задача удалена','bad'),false;
 if(r.type==='deadline'){if(t.deadline!==r.to)return toast('Срок задачи уже изменен — отменить нельзя','warn'),false;t.deadline=r.from}
 if(r.type==='priority'){if(t.priority!==r.to)return toast('Приоритет уже изменен — отменить нельзя','warn'),false;t.priority=r.from;t.slaDue=slaDate(t.createdAt||TODAY(),r.from)}
 return true;
}
function resolve(id,ok){
 const r=S.requests.find(x=>x.id===id);
 if(!canApprove())return toast('Нет прав на согласование','bad');if(r.by===ME.id)return toast('Свой запрос согласовать нельзя','bad');
 const fin=cm=>{
  if(ok&&!applyReq(r))return;
  r.status=ok?'approved':'rejected';r.resolver=ME.id;r.resolvedAt=TODAY();r.comment=cm||'';
  log(ok?'Запрос одобрен':'Запрос отклонен',`${reqName(r)} от ${uname(r.by)}${cm?'. Комментарий: '+cm:''}`);
  notify(r.by,`${ME.name} ${ok?'одобрил(а)':'отклонил(а)'} ваш запрос: ${reqName(r)}${cm?'. Комментарий: '+cm:''}`,{page:'req'});
  save();toast(ok?'Одобрено':'Отклонено',ok?'':'warn');render();
 };
 if(ok)fin('');else askReason('Отклонить запрос','Комментарий для сотрудника:',fin);
}
function changeDecision(id){
 const r=S.requests.find(x=>x.id===id);if(!r||!canApprove()||r.by===ME.id)return toast('Нет прав','bad');
 const toOk=r.status==='rejected';
 askReason('Изменить решение',`Сейчас: «${toOk?'отклонено':'одобрено'}». Станет: «${toOk?'одобрено':'отклонено'}»${toOk?' — изменение применится':' — изменение будет отменено'}. Укажите причину:`,cm=>{
  if(!(toOk?applyReq(r):revertReq(r)))return;
  r.history=(r.history||[]).concat({status:r.status,by:r.resolver,at:r.resolvedAt,comment:r.comment||''});
  r.status=toOk?'approved':'rejected';r.resolver=ME.id;r.resolvedAt=TODAY();r.comment=cm;
  log('Решение изменено',`${reqName(r)} от ${uname(r.by)}: ${toOk?'отклонено → одобрено':'одобрено → отклонено'}. Причина: ${cm}`);
  notify(r.by,`${ME.name} изменил(а) решение по вашему запросу на «${toOk?'одобрено':'отклонено'}»: ${reqName(r)}. Причина: ${cm}`,{page:'req'});
  save();render();toast('Решение изменено');
 });
}

function acat(a){const t=a.action;
 if(/^(Вход|Выход)$/.test(t))return 'auth';if(/Демо-режим/.test(t))return 'demo';if(/Запрос|Решение/.test(t))return 'req';if(/Событие/.test(t))return 'events';if(/базы знаний|статьи/.test(t))return 'kb';
 if(/договор/i.test(t))return 'contracts';if(/сделк|этап/i.test(t))return 'deals';if(/задач|срок/i.test(t))return 'tasks';
 if(/пользоват|роль|пароль/i.test(t))return 'users';if(/клиент|контакт|ответствен|реестр/i.test(t))return 'clients';return 'data'}
function openAudit(u){if(!canAudit())return;AU=u||'';AT='';AP='all';AQ='';AN=50;go('audit')}
function auditList(){
 const now=TODAY();const from=AP==='today'?now:AP==='7'?dOff(-6):AP==='30'?dOff(-29):AP==='custom'?AF:'';const to=AP==='custom'?ATo:'';
 const q=AQ.toLowerCase();
 return S.audit.filter(x=>{const d=iso(new Date(x.at));
  if(AU==='demo'){if(!x.via)return false}else if(AU&&x.by!==AU)return false;
  if(AT&&acat(x)!==AT)return false;if(from&&d<from)return false;if(to&&d>to)return false;
  if(q&&!(x.action+' '+x.details+' '+uname(x.by)).toLowerCase().includes(q))return false;return true});
}

function md(src){
 const L=String(src||'').replace(/\r/g,'').split('\n');let o='',i=0;
 const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\(((?:https?:\/\/|file:\/\/\/)[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\[\[([^\]]+)\]\]/g,(m,k)=>{const a=S.kb.articles.find(x=>x.key===k||x.title===k);return a?`<a href="#" onclick="kbShow('${a.id}');return false">${esc(a.title)}</a>`:esc(k)});
 const blk=/^(#{1,3}\s|\||\s*[-*]\s|\s*\d+[.)]\s|>)/;
 while(i<L.length){const l=L[i];if(!l.trim()){i++;continue}let m;
  if(m=l.match(/^(#{1,3})\s+(.*)/)){const n=m[1].length+1;o+=`<h${n}>${inl(m[2])}</h${n}>`;i++;continue}
  if(/^\|/.test(l)){const R=[];while(i<L.length&&/^\|/.test(L[i]))R.push(L[i++]);const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());

  if(/^\s*[-*]\s+/.test(l)){o+='<ul>';while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))o+='<li>'+inl(L[i++].replace(/^\s*[-*]\s+/,''))+'</li>';o+='</ul>';continue}
  if(/^\s*\d+[.)]\s+/.test(l)){o+='<ol>';while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i]))o+='<li>'+inl(L[i++].replace(/^\s*\d+[.)]\s+/,''))+'</li>';o+='</ol>';continue}
  if(/^>/.test(l)){const q=[];while(i<L.length&&/^>/.test(L[i]))q.push(L[i++].replace(/^>\s?/,''));o+=`<div class="kbnote">${q.map(inl).join('<br>')}</div>`;continue}

 }return o;
}

 else if(k==='tbl'){ins=`${s0&&txt[s0-1]!=='\n'?'\n':''}\n| Столбец 1 | Столбец 2 |\n| --- | --- |\n| | |\n`;cs=ce=s0+ins.length}
 if(lineMode){const blockEnd=e0>s0?e0:s0;const le=txt.indexOf('\n',blockEnd);const end=le<0?txt.length:le;const lines=txt.slice(ls,end).split('\n');const pre={h2:'## ',h3:'### ',ul:'- ',q:'> '}[k];
  const out=lines.map((l,i)=>{const c=l.replace(/^(#{1,3}\s|[-*]\s|\d+[.)]\s|>\s?)/,'');return (k==='ol'?`${i+1}. `:pre)+(c||(k.startsWith('h')?'Заголовок':'текст'))}).join('\n');
  ta.value=txt.slice(0,ls)+out+txt.slice(end);ta.focus();ta.setSelectionRange(ls,ls+out.length)}
 else{ta.value=txt.slice(0,s0)+ins+txt.slice(e0);ta.focus();ta.setSelectionRange(cs,ce)}
 ta.dispatchEvent(new Event('input'))}

const KB_VER=24;
const KB_SEED={"cats": [{"id": "crm", "name": "Работа в CRM", "order": 1}, {"id": "stages", "name": "Этапы воронки", "order": 2}, {"id": "sales", "name": "Продажи и переговоры", "order": 3}, {"id": "services", "name": "Услуги DSRC", "order": 4}, {"id": "templates", "name": "Шаблоны писем", "order": 5}, {"id": "suppliers", "name": "Работа с поставщиками", "order": 6}, {"id": "rules", "name": "Регламенты", "order": 7}], "articles": [{"id": "kb_start", "key": "start", "cat": "crm", "title": "С чего начать", "body": "DSRC CRM — система Департамента стратегического развития и реализации ТОО «Digital Silk Road Company» для учета клиентов, проектов (сделок), договоров, задач и поручений.\n\n## Вход\n- Логин — «первая буква имени.фамилия» латиницей, например d.kumarova. Регистр не важен.\n- Пароль — не короче 8 символов: латинские буквы, хотя бы одна заглавная и одна цифра (например, Dsrc2026a). Стартовый пароль выдает Admin; смените его после первого входа: щелчок по своему имени → «Мой профиль и пароль».\n- «Учетная запись отключена» — обратитесь к Admin.\n\n## Меню\n| Раздел | Для чего |\n| --- | --- |\n| Дашборд | картина по команде: воронка, прогноз, что требует внимания, задачи; сводная справка и отчет за период |\n| Воронка | проекты по этапам, перетаскивание, пауза, отказ |\n| Клиенты и лиды | компании, ответственные, последний контакт, импорт реестра; карточка клиента со справкой |\n| Договоры | реестр договоров, сроки, этапы оплаты |\n| Задачи | свои и командные задачи, SLA |\n| Поручения | протокольные поручения и свод исполнения |\n| База знаний | инструкции, этапы, шаблоны, регламенты |\n| Согласования | запросы на возврат этапа, перенос срока, смену приоритета |\n| Журнал действий | кто, когда и что изменил; восстановление удаленного |\n| Пользователи | учетные записи, роли, передача дел |\n| Данные | выгрузки, импорт, резервная копия, настройки |\n\nЧто видит каждая роль — [[roles]].\n\n## Быстрая работа\n- **Ctrl + K** или **/** — поиск. Ищет по разделу, где вы находитесь (в «Задачах» — задачи, в «Договорах» — договоры), и по всей CRM: клиенты по названию, БИН, контактам и тегам, проекты, договоры, задачи, поручения, статьи. Показывается только то, что разрешено вашей ролью.\n- **N** — новая сделка, **T** — задача, **C** — клиент, **E** — событие в открытой карточке клиента, **1–5** — Дашборд, Воронка, Клиенты, Задачи, Поручения, **?** — все клавиши. Работают в любой раскладке, когда курсор не в поле ввода.\n- **Мои фильтры** в клиентах, задачах и поручениях — сохранить свой набор фильтров.\n- **?** рядом с названием этапа в воронке — статья об этом этапе.\n- 🔔 — уведомления. С телефона меню открывается кнопкой ☰.", "order": 1}, {"id": "kb_roles", "key": "roles", "cat": "crm", "title": "Роли и права", "body": "Просматривать данные могут все роли. Различаются права на изменения. Точная матрица — «Пользователи» → «Матрица прав».\n\n| Действие | Project Manager | Admin | User-approver | User | Viewer |\n| --- | --- | --- | --- | --- | --- |\n| Клиенты, проекты, события, задачи | все | все | все | свои проекты и проекты, где он участник | — |\n| Новый проект | любой этап, кроме «Успешно» и «Отказ» | так же | так же | «Лид» или «Квалификация», становится ответственным | — |\n| Ответственный и участники проекта | да | да | да | участники своего проекта | — |\n| Возврат этапа, перенос срока, смена приоритета | сразу | сразу | сразу | через согласование | — |\n| Согласование запросов (кроме своих) | да | да | да | — | — |\n| Поручения: создание | да | да | да | исполняет свои | — |\n| Импорт реестра, выгрузки в Excel | да | да | да | — | — |\n| Журнал действий, отчет за период | да | да | да | — | — |\n| Сводная справка | да | да | — | — | — |\n| Удаление и восстановление записей | да | да | — | — | — |\n| Пользователи, передача дел | да | да | — | — | — |\n| Настройки, резервная копия, очистка базы | да | да | — | — | — |\n| Сброс к демо-данным | — | да | — | — | — |\n| Демо-режим (работа под другой ролью) | да | — | — | — | — |\n| Редактирование базы знаний | да | да | да | — | — |\n\nСвой запрос согласовать нельзя. Viewer только смотрит: кнопок изменения у него нет.\n\n**User-billing** — сотрудник, который ведет расчеты с контрагентами. Видит только разделы «Договоры» и «Оплаты». Договоры только просматривает (сумма, сроки и статус не меняются), но по всем договорам вносит акты, счета и поступления оплат, выгружает отчеты. Клиенты, воронка, задачи и остальные разделы ему недоступны. Ответственный по договору получает уведомление, когда User-billing отмечает акт или оплату.", "order": 2}, {"id": "kb_dashboard", "key": "dashboard", "cat": "crm", "title": "Дашборд", "body": "Картина по команде на сегодня. Кнопки справа вверху — «Сводная справка» и «Отчет за период» ([[chronology]]).\n\n- **Показатели:** воронка (сумма активных проектов), взвешенный прогноз, договоры, запросы на согласовании. Проекты на паузе — отдельно («на паузе»).\n- **Воронка по этапам** — количество и сумма на каждом этапе.\n- **Требует внимания** — по срочности: просроченные задачи, просроченные и ближайшие (7 дней) этапы оплаты, истекающие договоры, проекты без движения более 14 дней, клиенты без контакта, нераспределенные лиды. Фильтр по сотруднику.\n- **Прогноз подписания по месяцам** — по полю «Ожидаемая дата подписания».\n- **Почему теряем и откладываем** — причины отказов и пауз.\n- **Распределение задач** — по статусам, по команде и по сотрудникам; щелчок открывает «Задачи».\n- **Команда** — проекты, суммы, просрочки, задачи «в срок», встречи за 30 дней.\n\n## Как считается прогноз\nВзвешенный прогноз = сумма проекта × вероятность его этапа. По умолчанию: Лид 5%, Квалификация 15%, КП направлено 30%, Переговоры 50%, Тех. соглашение 70%, Договор 90%. Вероятности меняет Project Manager или Admin: «Данные» → «Прогноз: вероятность по этапам». «Успешно», «Отказ» и проекты на паузе в прогноз не входят.", "order": 3}, {"id": "kb_pipeline", "key": "pipeline", "cat": "crm", "title": "Воронка и проекты", "body": "Проект (сделка) идет по этапам: Лид → Квалификация → КП направлено → Переговоры → Тех. соглашение → Договор → Успешно. На любом этапе его можно приостановить или перевести в «Отказ». Что значит каждый этап — рубрика «Этапы воронки».\n\n## Ответственный и участники\n- По одному клиенту может быть несколько проектов, у каждого — свой **ответственный** и **участники**. Их выбирают в карточке сделки; участники ведут проект наравне с ответственным и получают уведомление о добавлении.\n- **Ответственный по клиенту** ведет отношения с компанией; его смена проекты не переносит.\n- Задачи «шаг сделки» и напоминания по паузе ставятся ответственному по проекту. Фильтр «Мои сделки» показывает проекты, где вы ответственный или участник.\n\n## Движение по этапам\n- **Вперед** — только на следующий этап: перетащите карточку или нажмите «▶» (подсказка с названием этапа — при наведении), отметьте чек-лист, напишите комментарий. С этапа «КП направлено» обязательна сумма.\n- **Назад** (◀) — с причиной; у User — через согласование, сделка помечается «⏳ запрошен возврат».\n- **Успешно** — только когда в «Договорах» есть подписанный договор по этой сделке.\n- **Отказ** (✕) — причина из списка, для «Другое» — подробности. Вернуть из отказа — «◀ в «Лид»».\n\n## Следующий шаг\nПоля «Следующий шаг» и «Срок шага» — в карточке сделки и при переходе на этап.\n- Со сроком CRM ставит ответственному задачу с меткой «шаг сделки»; на карточке — «→ шаг · до ДД.ММ.ГГГГ», просроченный — красным.\n- Галочка у задачи открывает окно «Шаг выполнен»: результат (в хронологию и справку) и новый шаг. Пока окно не сохранено, задача не выполнена.\n- Новый шаг — это продолжение того же проекта. Новую сделку заводят только для нового проекта (другой год, другая услуга).\n\n## Пауза\nКнопка паузы на карточке или перетаскивание в «В приостановлении»: причина из списка и дата напоминания. Этап сохраняется. В дату напоминания у ответственного задача «вернуться к проекту»; при ее выполнении CRM предлагает продлить паузу или возобновить проект. «Возобновить ▶» на карточке — вернуть раньше.\n\n## Ожидаемая дата подписания\nПоле в карточке сделки. Нужно для прогноза по месяцам, плана в отчете за период и сводной справки. Прошедшая дата без подписанного договора выделяется красным.\n\n## Метки на карточке\n«Х дн.» — дней на этапе (желтая — больше 14); «участники: …» — инициалы участников; «пора вернуться» — наступила дата напоминания по паузе.", "order": 4}, {"id": "kb_clients", "key": "clients", "cat": "crm", "title": "Клиенты и лиды", "body": "Список всех компаний с номером, статусом, ответственным и последним контактом. Щелчок по строке — карточка клиента: проекты, договоры, задачи, контакты, хронология и кнопка «Справка».\n\n## Статус\nЛид, Клиент, Партнер или Неактивен — выбирается вручную в карточке клиента. Автоматически «Лид» становится «Клиентом», когда его проект переходит в «Успешно».\n\n## Ответственный по клиенту\nСотрудник, который ведет отношения с компанией. Назначается в карточке клиента. Ответственные по проектам задаются отдельно — [[pipeline]].\n\n## Последний контакт\nДата последней ручной записи в хронологии (служебные записи и записи об оплатах не считаются). Зеленый — недавно, желтый и красный — давно (пороги настраиваются в «Данных»).\n\n## БИН, дубли, теги\n- БИН проверяется по контрольной цифре. Клиента с тем же БИН или названием завести нельзя; на похожее название CRM предупредит — если это другая компания, нажмите «Сохранить» еще раз.\n- **Теги** — через запятую («квазигос», «реестр 150»). Фильтр по тегу и поиск — в списке клиентов.\n\n## Импорт реестра\n«⇪ Импорт реестра» (Excel или CSV) по шаблону «⇩ Шаблон»: наименование, БИН, отрасль, статус, регион, ответственный, заметки, теги. Дубли пропускаются, замечания показываются в отчете об импорте.", "order": 5}, {"id": "kb_tasks", "key": "tasks", "cat": "crm", "title": "Задачи, поручения, согласования", "body": "## Задачи\nГруппы: Просрочено, Сегодня, Ближайшие 7 дней, Позже, Выполнено. Фильтры: мои или вся команда, сотрудник, статус.\n\n| Приоритет | Срок по SLA |\n| --- | --- |\n| Высокий | 1 рабочий день |\n| Средний | 3 рабочих дня |\n| Низкий | 7 рабочих дней |\n\n- Срок подставляется по SLA; позже SLA — пометка «срок позже SLA». «В срок» считается от первоначального срока.\n- Задачи с метками «шаг сделки», «пауза» и «поручение» отмечаются выполненными только после заполнения окна (результат, продление, отчет). Закрыли окно — задача остается открытой.\n- Сняли галочку по ошибке — служебная запись о выполнении удаляется сама.\n- Удалить задачу может руководитель или тот, кто ее поставил (с причиной).\n\n## Поручения\nУчет пунктов протоколов совещаний. «+ Поручение» (Project Manager, Admin, User-approver): протокол, дата, № пункта, текст, исполнитель, срок.\n- Исполнителю ставится задача «поручение» с высоким приоритетом; при выполнении он пишет отчет об исполнении.\n- Статусы: В работе, Срок близко (3 дня), Просрочено, Исполнено, Снято. Сортировка — по сроку, дате протокола или статусу.\n- «⇩ Свод исполнения (Word)» — таблица по каждому протоколу.\n\n## Согласования\nВозврат этапа, перенос срока и смена приоритета у User идут через Project Manager, Admin или User-approver: запрос с причиной → «Одобрить» или «Отклонить» → автор получает уведомление. Ошибочное решение исправляется «Изменить решение». Свой запрос согласовать нельзя.\n\n## Уведомления\n🔔 в шапке: назначение задачи или поручения, участие в проекте, решения по запросам, передача дел. Показываются 5 последних; если новых больше — все новые. Просмотренные отмечаются прочитанными.", "order": 7}, {"id": "kb_chronology", "key": "chronology", "cat": "crm", "title": "Хронология, справки и отчеты", "body": "## Хронология\nИстория клиента: «+ событие» (или клавиша E) — тип (встреча, звонок, письмо, документ / КП), дата (не в будущем), проект, что сделано. Сюда же автоматически попадают результаты шагов, причины пауз и отказов, выполненные акты, счета и оплаты.\n- Пишите кратко и по делу: «направлено КП», «проведена встреча, получены замечания».\n- Служебные записи (переходы, задачи, переносы сроков) по умолчанию скрыты в справке.\n- Ошибочную запись удаляет Project Manager или Admin с причиной; вернуть ее можно из журнала.\n\n## Справка по клиенту\nКарточка клиента → «Справка» → проект или «Все сделки» → «Копировать» или «Word».\n- В начале — договор: номер, дата, сумма, статус, «Оплачено … из …», ближайший этап оплаты.\n- Затем проект: этап, сумма, ответственный, участники, пауза, ожидаемое подписание, следующий шаг.\n- В конце — хронология. При «Все сделки» проекты идут под номерами, а хронология делится на «Проект 1», «Проект 2» и «Общее по клиенту».\n\n## Сводная справка (Project Manager, Admin)\nДашборд → «Сводная справка»: итоги (проекты, сумма, прогноз, подписания в месяце, требуют внимания) и таблицы по этапам или ответственным. «Требуют внимания: без шага» — проекты без следующего шага (кроме паузы). Фильтр «Лиды без суммы и шага» убирает только такие лиды.\n\n## Отчет за период (Project Manager, Admin, User-approver)\nДашборд → «Отчет за период»: текущий или прошлый месяц, квартал, год или свой период. Показатели, выигранные проекты и договоры, отказы с причинами, работа сотрудников и план — проекты с ожидаемой датой подписания в 30 дней после периода. Выгрузка в Word.\n\n> Справки хороши настолько, насколько аккуратно ведется хронология.", "order": 8}, {"id": "kb_data", "key": "data", "cat": "crm", "title": "Пользователи, данные, журнал", "body": "## Пользователи (Project Manager, Admin)\n- Новый сотрудник: «+ Пользователь» — ФИО, должность, логин, роль, пароль.\n- Сотрудника не удаляют, а **отключают**: если у него есть клиенты, проекты или задачи, откроется «Передача дел» — выберите преемника для всех дел или по каждому. Остаются запись в журнале, служебные записи в хронологии, «Ранее вели: …» и акт передачи дел в Word.\n\n## Данные\n- **Выгрузки в Excel** — клиенты, сделки, договоры, задачи; **шаблон импорта**.\n- **Резервная копия** — «⇩ Выгрузить JSON» хотя бы раз в неделю: очистка истории браузера удалит данные. «⇪ Загрузить» — восстановить базу из файла.\n- **Настройки** (Project Manager, Admin): вероятности этапов для прогноза, причины отказа и паузы, чек-листы этапов, SLA, пороги последнего контакта.\n- **Очистить базу** (Project Manager, Admin) — удаляет клиентов, проекты, договоры, задачи, запросы и поручения; пользователи, журнал и база знаний остаются. **Сбросить к демо** — только Admin. **Освежить даты** (Project Manager, Admin) — сдвигает даты демо-данных к сегодняшнему дню, сохраняя внесенные изменения.\n\n## Журнал действий\nКто, когда и что сделал; фильтры по сотруднику, действию и периоду; выгрузка в CSV. Показываются последние 50 записей, дальше — «Показать еще 50». Хранятся 2000 последних записей.\n\n**Восстановление.** У строки удаления — «↺ Восстановить» (Project Manager, Admin): клиент вместе с проектами, договорами, задачами и хронологией, а также проект, договор, задача, запись хронологии, контакт, этап оплаты.", "order": 9}, {"id": "kb_faq", "key": "faq", "cat": "crm", "title": "Частые вопросы", "body": "| Вопрос | Ответ |\n| --- | --- |\n| Видят ли коллеги мои данные? | В HTML-версии база хранится в браузере одного компьютера. Общая база — в серверной версии. |\n| Почему нельзя перетащить проект сразу в «Договор»? | Этапы не пропускаются: на каждом заполняется чек-лист. |\n| Почему не переводится в «Успешно»? | Сначала внесите подписанный договор по этому проекту в «Договоры». |\n| Не вижу кнопок на карточке проекта | Вы не ответственный и не участник проекта — попросите добавить вас участником. |\n| Почему проект не вернулся назад? | У User возврат идет через согласование — смотрите «Согласования». |\n| Отметила задачу по ошибке | Снимите галочку — запись о выполнении удалится. |\n| Удалила по ошибке | Журнал действий → строка удаления → «↺ Восстановить» (Project Manager, Admin). |\n| Откуда план в отчете за период? | Проекты с ожидаемой датой подписания в 30 дней после периода. |\n| Пропали данные | Проверьте, тот ли браузер и компьютер; иначе — загрузить последний JSON. |", "order": 10}, {"id": "kb_contracts", "key": "contracts", "cat": "crm", "title": "Договоры", "body": "Реестр договоров: номер, контрагент, предмет, дата заключения, сумма, срок, статус (Проект, На согласовании, Подписан, Исполнен, Расторгнут).\n\n- При статусе «Подписан» в хронологию добавляется «договор № … подписан».\n- До окончания срока показывается остаток дней; за 60 дней договор появляется на дашборде.\n- User работает с договорами по своим клиентам и проектам, где он ответственный или участник.\n- Номер договора уникален; срок действия не может быть раньше даты заключения; у подписанного договора обязательна дата.\n- Договор, которым подтверждена сделка в «Успешно», нельзя удалить или вернуть в «Проект» / «На согласовании» — сначала верните сделку на этап «Договор». Перевести его в «Исполнен» или «Расторгнут» можно.\n- Ошибочный договор удаляет Project Manager или Admin (с причиной); вернуть его можно из журнала действий.\n- Под полем суммы есть подсказка («1,5 млрд ₸ · 1 500 000 000 ₸»), чтобы не ошибиться с нулями.\n\n## Продление\nОтметка «планируется продление» в карточке договора. Такой договор помечен «продление» в реестре и в «Требует внимания» на дашборде.\n\n## Этапы оплаты и акты\nКнопка «Этапы оплаты и акты» в карточке договора (или «₸» в карточке клиента).\n- Этап: что (акт, счет, оплата), описание, дата, сумма.\n- За 7 дней до даты этап появляется в «Требует внимания» на дашборде, просроченный — там же, красным.\n- Галочка — этап выполнен: в хронологию пишется запись «направлен акт / выставлен счет / получена оплата … по договору № …», она попадает в справку. «Последний контакт» она не меняет.\n- Сняли галочку по ошибке — запись из хронологии удаляется сама, повторная отметка ее не дублирует.\n- ✎ — изменить этап: что, описание, плановую дату, сумму, а у выполненного — дату факта (запись в хронологии обновится).\n- В справке по клиенту у договора — «Оплачено … из …» и ближайший этап.\n- В реестре договоров видно «оплачено … из …» и ближайший этап.\n- Если оплат запланировано больше суммы договора, CRM предупредит.\n- Вести этапы может тот, кто ведет договор; остальные видят их только для просмотра.\n\n## Оплаты\nВкладка **«Оплаты»** собирает данные из договоров (этапы, акты, счета) и показывает их в трех режимах. Отдельных данных у вкладки нет: отмеченное здесь сразу видно в договоре, и наоборот.\n\n**Поступления** — фактически полученные оплаты.\n- **+ Поступление** — дата, сумма, за какой месяц, № платежного документа. Можно закрыть им этап графика; если поступило меньше — остаток станет отдельным этапом.\n- Период (месяц, квартал, год, свои даты), фильтры по контрагенту и ответственному, суммы по месяцам и по контрагентам.\n- **⇩ Excel** — реестр, **⇩ Отчет Word** — отчет о поступлениях за период.\n\n**По договорам** — сколько оплачено из суммы договора: сумма, оплачено, остаток, процент, последняя оплата. Выгрузка в Excel и Word («Сведения об оплате по договорам»).\n\n**Акты и счета** — реестр документов со статусами: к выставлению → выставлен → принят (для акта) → оплачен.\n- Кнопка в строке переводит документ на следующий шаг; «Оплачен» сразу создает поступление.\n- **+ Акт / счет** — новый документ; ✎ — изменить даты. Если очистить дату, статус вернется назад.\n- Ответственный по договору получает уведомление, когда акт выставлен, принят или поступила оплата.\n- В «Требует внимания» попадают акты, не принятые 10+ дней, и документы без оплаты 30+ дней после принятия.\n\nКаждое событие записывается в хронологию клиента и попадает в справку.", "order": 6}, {"id": "kb_stage_pause", "key": "stage_pause", "cat": "stages", "title": "В приостановлении", "body": "## Что это\nПроект временно остановлен по причине, не зависящей от DSRC: заказчик пересматривает бюджет, ждет решения руководства, идет реорганизация, сменился куратор. Это не отказ: интерес у клиента есть, но двигаться сейчас нельзя.\n\n## Что сделать\n- указать причину приостановления (обязательно);\n- поставить дату, когда вернуться к вопросу (обязательно);\n- в дату напоминания связаться с клиентом и решить: продлить паузу или возобновить проект.\n\n## Когда возобновлять\nКогда у клиента появилось решение, бюджет или новый куратор. Проект вернется на тот этап, с которого был приостановлен.\n\n## Частая ошибка\nДержать проект «на паузе» месяцами без контакта. Если интереса нет — переведите в «Отказ» с причиной.\n\nПодробнее — [[pipeline]].", "order": 9}, {"id": "kb_stage_lead", "key": "stage_lead", "cat": "stages", "title": "1. Лид", "body": "## Что это\nКомпания, с которой еще не обсуждали сотрудничество: из реестра крупнейших компаний, входящий запрос, рекомендация.\n\n## Что сделать на этапе\n- назначить ответственного (пока его нет, лид висит в «нераспределенных»)\n- найти контактное лицо\n- провести первый звонок или встречу\n\n## Когда переходить дальше\nПереходите в «Квалификацию», когда состоялся первый разговор с клиентом.\n\n## Частая ошибка\nЛид без ответственного неделями — его никто не ведет.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняют Project Manager и Admin: «Данные» → «Чек-листы этапов».", "order": 1}, {"id": "kb_stage_qual", "key": "stage_qual", "cat": "stages", "title": "2. Квалификация", "body": "## Что это\nПроверка, стоит ли тратить силы: станет ли компания реальным клиентом.\n\n## Что сделать на этапе\n- потребность: есть ли задача, которую решает DSRC\n- кто принимает решение\n- бюджет: есть ли он и примерный размер\n- сроки: когда клиенту это нужно\n\n## Когда переходить дальше\nЕсли все сходится — готовьте КП. Если потребности нет или клиент «просто собирает информацию» — «Отказ» с причиной.\n\n## Частая ошибка\nГотовить КП, не выяснив потребность и бюджет.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняют Project Manager и Admin: «Данные» → «Чек-листы этапов».", "order": 2}, {"id": "kb_stage_kp", "key": "stage_kp", "cat": "stages", "title": "3. КП направлено", "body": "## Что это\nКлиенту отправлено коммерческое предложение.\n\n## Что сделать на этапе\n- указать сумму сделки (обязательно с этого этапа)\n- договориться о сроке обратной связи\n- поставить задачу-напоминание\n\n## Когда переходить дальше\nПереходите в «Переговоры», когда получена обратная связь по КП.\n\n## Частая ошибка\nОтправить КП и ждать без срока — сделка «застревает».\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняют Project Manager и Admin: «Данные» → «Чек-листы этапов».", "order": 3}, {"id": "kb_stage_nego", "key": "stage_nego", "cat": "stages", "title": "4. Переговоры", "body": "## Что это\nОбсуждение условий: объем, цена, сроки, формат работ.\n\n## Что сделать на этапе\n- зафиксировать замечания клиента в хронологии\n- согласовать сроки и бюджет\n- определить, нужно ли тех. соглашение\n\n## Когда переходить дальше\nПереходите дальше, когда условия согласованы.\n\n## Частая ошибка\nУстные договоренности, не записанные в хронологию.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняют Project Manager и Admin: «Данные» → «Чек-листы этапов».", "order": 4}, {"id": "kb_stage_tech", "key": "stage_tech", "cat": "stages", "title": "5. Тех. соглашение", "body": "## Что это\nСогласование технических требований (БТ/ТЗ) и технического соглашения.\n\n## Что сделать на этапе\n- согласовать требования с клиентом и аналитиками DSRC\n- направить тех. соглашение\n- отслеживать статус рассмотрения у заказчика\n\n## Когда переходить дальше\nПереходите в «Договор», когда тех. соглашение согласовано или подписано.\n\n## Частая ошибка\nНе фиксировать, у кого на рассмотрении документ.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняют Project Manager и Admin: «Данные» → «Чек-листы этапов».", "order": 5}, {"id": "kb_stage_contract", "key": "stage_contract", "cat": "stages", "title": "6. Договор", "body": "## Что это\nПодготовка и подписание договора.\n\n## Что сделать на этапе\n- согласовать проект договора с юристами\n- направить договор на подписание\n- подтвердить сумму договора\n\n## Когда переходить дальше\nПереходите в «Успешно», когда договор подписан. Внесите его в раздел «Договоры».\n\n## Частая ошибка\nСделка «Успешно» без договора в реестре.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняют Project Manager и Admin: «Данные» → «Чек-листы этапов».", "order": 6}, {"id": "kb_stage_won", "key": "stage_won", "cat": "stages", "title": "7. Успешно", "body": "## Что это\nДоговор подписан, работа с клиентом переходит в исполнение.\n\n## Что сделать на этапе\n- внести договор в раздел «Договоры» (номер, дата, сумма, срок)\n- определить дату начала работ\n\n## Когда переходить дальше\nСделка закрыта. Клиент со статусом «Лид» автоматически становится «Клиентом».\n\n## Частая ошибка\nЗабыть указать срок договора — CRM не предупредит об окончании.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняют Project Manager и Admin: «Данные» → «Чек-листы этапов».", "order": 7}, {"id": "kb_stage_lost", "key": "stage_lost", "cat": "stages", "title": "8. Отказ", "body": "## Что это\nСделка не состоялась.\n\n## Что сделать на этапе\n- указать причину отказа (обязательно)\n\n## Когда переходить дальше\nПричины отказов помогают понять, что улучшить. Вернуть сделку из «Отказа» можно с причиной (у User — через согласование).\n\n## Частая ошибка\nНе писать настоящую причину.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняют Project Manager и Admin: «Данные» → «Чек-листы этапов».", "order": 8}, {"id": "kb_qual_questions", "key": "qual_questions", "cat": "sales", "title": "Квалификация: вопросы клиенту", "body": "Цель — за один-два разговора понять, есть ли смысл готовить КП.\n\n| Что выяснить | Примерный вопрос |\n| --- | --- |\n| Потребность | Какую задачу вы хотите решить? Как она решается сейчас? |\n| Кто решает | Кто еще участвует в решении? Кто согласует бюджет? |\n| Бюджет | Заложен ли бюджет? В каком году и по какой статье? |\n| Сроки | К какому сроку нужно решение? Что будет, если не успеть? |\n\n> Ответы запишите в хронологию — они понадобятся при подготовке КП и справки.", "order": 1}, {"id": "kb_services_catalog", "key": "services_catalog", "cat": "services", "title": "Каталог услуг (заполнить)", "body": "> Заготовка. Опишите каждую услугу по шаблону ниже. Описывайте нейтрально, без данных конкретных клиентов.\n\n## Передача данных\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:\n\n## Интеграционное решение\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:\n\n## Индивидуальная разработка\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:\n\n## Аналитика / дашборды\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:\n\n## Проверка контрагентов\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:", "order": 1}, {"id": "kb_tpl_kp_reminder", "key": "tpl_kp_reminder", "cat": "templates", "title": "Напоминание клиенту о КП", "body": "> Заготовка — поправьте под стиль DSRC.\n\n**Тема:** Коммерческое предложение DSRC — ваша обратная связь\n\nДобрый день, [Имя Отчество]!\n\n[Дата] мы направили коммерческое предложение по [кратко о задаче]. Подскажите, пожалуйста, удалось ли его рассмотреть? Если есть вопросы или замечания, готовы обсудить их на коротком созвоне в удобное для вас время.\n\nС уважением,\n[Имя Фамилия], [должность]\nТОО «Digital Silk Road Company»", "order": 1}, {"id": "kb_tpl_request_docs", "key": "tpl_request_docs", "cat": "templates", "title": "Запрос требований у клиента", "body": "> Заготовка — поправьте под стиль DSRC.\n\n**Тема:** Запрос исходных требований\n\nДобрый день, [Имя Отчество]!\n\nДля подготовки предложения просим направить:\n- описание задачи и ожидаемого результата;\n- текущие системы и форматы данных;\n- желаемые сроки;\n- контактное лицо с технической стороны.\n\nС уважением,\n[Имя Фамилия], [должность]", "order": 2}, {"id": "kb_suppliers_start", "key": "suppliers_start", "cat": "suppliers", "title": "Работа с поставщиками: с чего начать", "body": "> Проект регламента. Перечень документов и порядок согласования уточните с юристами и бухгалтерией DSRC — затем отредактируйте статью.\n\n## С чего начать\n1. **Потребность.** Что нужно, объем, сроки, ориентировочный бюджет. Согласуйте с руководителем.\n2. **Порядок закупки.** Уточните у ответственного за закупки, нужна ли процедура закупки и в каком порядке она проводится.\n3. **Поиск поставщиков.** Подберите не менее трех поставщиков, чтобы было что сравнить.\n4. **Запрос КП.** Направьте запрос с описанием потребности или технической спецификацией — шаблон: [[tpl_supplier_kp]].\n5. **Сравнение.** Сведите КП в таблицу: цена, сроки, условия оплаты, гарантия, опыт.\n6. **Проверка поставщика** (см. ниже).\n7. **Согласование выбора** с руководителем (служебная записка с таблицей сравнения).\n8. **Договор** — по шаблону DSRC (раздел «Шаблоны договоров»), согласование с юристами, подписание.\n9. **Исполнение и закрытие:** акт выполненных работ или накладная, счет-фактура, оплата.\n\n## Что запросить у поставщика\n| Документ | Зачем |\n| --- | --- |\n| Коммерческое предложение на бланке, с датой, подписью и сроком действия | основание для сравнения и выбора |\n| Справка о государственной регистрации (перерегистрации) | подтверждает, что компания действует |\n| Сведения об отсутствии налоговой задолженности | проверка благонадежности |\n| Свидетельство о постановке на учет по НДС (если плательщик НДС) | для счета-фактуры и расчета цены |\n| Реквизиты: БИН, банк, ИИК, БИК, КБе, юридический адрес | для договора и оплаты |\n| Документ о полномочиях подписанта (приказ или доверенность) | договор подписывает уполномоченное лицо |\n| Лицензии, сертификаты — если вид работ этого требует | подтверждает право выполнять работы |\n\n## Что направить поставщику от DSRC\n- запрос КП или техническую спецификацию;\n- реквизиты DSRC (карточку предприятия);\n- проект договора по шаблону DSRC.\n\n## Как проверить поставщика\n- БИН и статус компании — по открытым государственным сервисам;\n- отсутствие в реестре недобросовестных участников закупок;\n- отзывы и опыт аналогичных работ.\n\n## Шаблоны договоров\n> Ссылки на шаблоны добавляются сюда. Храните шаблоны на сервере или общем диске DSRC; ссылки — вида https://… или file:///….\n\n- Договор поставки товаров — ссылка будет добавлена\n- Договор оказания услуг — ссылка будет добавлена\n- Договор выполнения работ — ссылка будет добавлена\n\n## Частые ошибки\n- Одно КП без сравнения.\n- Работы начаты до подписания договора.\n- КП без даты и срока действия.\n- Нет документа о полномочиях подписанта.", "order": 1}, {"id": "kb_tpl_supplier_kp", "key": "tpl_supplier_kp", "cat": "templates", "title": "Запрос КП у поставщика", "body": "**Тема:** Запрос коммерческого предложения\n\nДобрый день!\n\nТОО «Digital Silk Road Company» рассматривает возможность приобретения [что именно]. Просим направить коммерческое предложение с указанием:\n- стоимости с учетом НДС (или без НДС — укажите);\n- сроков поставки / выполнения;\n- условий оплаты;\n- гарантийных обязательств;\n- срока действия предложения.\n\nОписание потребности (техническая спецификация) — во вложении.\n\nКоммерческое предложение просим направить на бланке организации, с подписью уполномоченного лица, до [дата].\n\nС уважением,\n[ФИО, должность, телефон]", "order": 3}, {"id": "kb_rules_crm", "key": "rules_crm", "cat": "rules", "title": "Регламент ведения CRM (проект)", "body": "> Проект регламента — согласовать с руководителем.\n\n1. Событие по клиенту вносится в хронологию в день, когда оно произошло.\n2. У каждой сделки с этапа «КП направлено» указана сумма.\n3. У каждого клиента есть ответственный, у каждого проекта — ответственный по проекту; нераспределенные лиды распределяются в течение 3 рабочих дней.\n4. Сделка без движения более 14 дней — повод для действия или комментария.\n5. Подписанный договор вносится в раздел «Договоры» в день подписания.\n6. Изменения сроков и возвраты этапов — только с причиной.\n7. Резервная копия базы — еженедельно (Project Manager или Admin).", "order": 1}]};
function seedKb(){const k=JSON.parse(JSON.stringify(KB_SEED));k.articles.forEach(a=>{a.createdAt=TODAY();a.updatedAt=TODAY();a.updatedBy='system'});return k}
// обновить системные статьи, которые никто не редактировал; добавить новые
function updateKb(){if((S.kb.ver||1)>=KB_VER)return;const k=seedKb();S.kb.articles=S.kb.articles.filter(o=>!(['myday','onboarding','approvals','notifications','audit','offboarding','orders','reports','hotkeys'].includes(o.key)&&o.updatedBy==='system'&&!(o.hist||[]).length));k.articles.forEach(n=>{const o=S.kb.articles.find(x=>x.key===n.key);if(!o)S.kb.articles.push(n);else if(o.updatedBy==='system'&&!(o.hist||[]).length){o.title=n.title;o.body=n.body;o.updatedAt=TODAY()}});k.cats.forEach(c=>{if(!S.kb.cats.some(x=>x.id===c.id))S.kb.cats.push(c)});S.kb.ver=KB_VER}

function spravka(cid){
 const ds=S.deals.filter(d=>d.clientId===cid);
 openModal('Справка для руководства',`<p class="mut small">Формируется автоматически: в начале — информация о договоре, в конце — хронология.</p>
  <div class="r2"><div><label>Проект (сделка)</label><select id="sp_d" onchange="spGen('${cid}')">${opt([['','Все проекты клиента'],...ds.map(d=>[d.id,d.title])],(ds.find(d=>!['won','lost'].includes(d.stage))||[...ds].sort((x,y)=>(y.stageAt||'').localeCompare(x.stageAt||''))[0])?.id||'')}</select></div>
  <div><label>Служебные события</label><select id="sp_a" onchange="spGen('${cid}')"><option value="0">не включать</option><option value="1">включать</option></select></div></div>
  <pre class="spr" id="sp_t" style="margin-top:14px"></pre>
  <div style="display:flex;gap:8px;margin-top:4px"><button class="btn" onclick="navigator.clipboard.writeText(sp_t.innerText).then(()=>toast('Скопировано'))">⧉ Копировать</button><button class="btn" onclick="spWord()">⇩ Word</button></div>`,null);
 spGen(cid);
}
const teamTxt=d=>(d.team||[]).filter(x=>x!==d.owner).map(uname).filter(Boolean).join(', ');
function spDealLines(d,ind){const i=ind||'';let t=`${i}Текущий этап: ${st(d.stage).n}${+d.amount?'. Ожидаемая сумма: '+money(d.amount):''}.\n${i}Ответственный: ${uname(d.owner)||'не назначен'}.${teamTxt(d)?' Участники: '+teamTxt(d)+'.':''}\n`;

<script>
/* =====================================================================
   DSRC CRM ⇄ GitHub — синхронизация данных и кода через папку репозитория
   ---------------------------------------------------------------------
   Как устроено:
   • Каждый компьютер (браузер) пишет СВОЙ файл data/nodes/<компьютер>.json —
     в Git файлы разных компьютеров не конфликтуют.
   • При синхронизации CRM читает файлы других компьютеров и сливает их
     изменения в свою базу (трехстороннее слияние merge3 по ID записей).
   • data/latest — общий срез для Power BI (JSON, CSV, XLSX), data/history —
     снимок за день, data/backup — полная копия с паролями (в GitHub не уходит).
   • Пароли в GitHub не попадают: у каждого компьютера свои.
   • Отправку и получение из GitHub делает sync.ps1 (вручную или по расписанию).
   • Если из GitHub пришла новая версия index.html — CRM предложит обновить страницу.
   Модуль самостоятельный: при новой версии CRM этот <script> переносится как есть.
   ===================================================================== */
var GH={dir:null,busy:false,t:null,ver:null,choice:null,state:'off',err:''};
const ghLS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ghN=s=>(s||'').replace(/^﻿/,'').replace(/\r\n/g,'\n');
function ghNode(){let n=ghLS.get('dsrc_node');if(!n){n='pc-'+Math.random().toString(36).slice(2,8);ghLS.set('dsrc_node',n)}return n}
function ghAutoOn(){return ghLS.get('dsrc_repo_auto')!=='0'}
// --- хранилище дескриптора папки и «последних увиденных» версий (IndexedDB) ---
function ghIdb(mode,fn){return new Promise((res,rej)=>{const o=indexedDB.open('dsrc_repo',1);o.onupgradeneeded=()=>o.result.createObjectStore('h');o.onerror=()=>rej(o.error);
 o.onsuccess=()=>{try{const tx=o.result.transaction('h',mode),q=fn(tx.objectStore('h'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}}})}
const ghKV={get:k=>ghIdb('readonly',s=>s.get(k)).catch(()=>undefined),set:(k,v)=>ghIdb('readwrite',s=>s.put(v,k)).catch(()=>{})};

async function ghSub(dir,parts,create){let d=dir;for(const p of parts)d=await d.getDirectoryHandle(p,{create:!!create});return d}
async function ghRead(dir,path){try{const ps=path.split('/'),fn=ps.pop();const d=await ghSub(dir,ps);return await (await (await d.getFileHandle(fn)).getFile()).text()}catch(e){return null}}
async function ghWrite(dir,path,data){const ps=path.split('/'),fn=ps.pop();const d=await ghSub(dir,ps,true);const w=await (await d.getFileHandle(fn,{create:true})).createWritable();await w.write(data);await w.close()}
async function ghList(dir,path){try{const d=await ghSub(dir,path.split('/'));const out=[];for await(const [n,h] of d.entries())if(h.kind==='file'&&n.endsWith('.json'))out.push(n.slice(0,-5));return out.sort()}catch(e){return []}}

 {f:'clients',n:'Клиенты',h:['ID','Компания','БИН','Статус','Отрасль','Регион','Источник','Ответственный','Теги','Создан'],r:S.clients.map(c=>[c.id,c.name,c.bin||'',CSTAT[c.status]||c.status||'',c.industry||'',c.region||'',c.source||'',uname(c.owner),(c.tags||[]).join(', '),I(c.createdAt)])},

 {f:'tasks',n:'Задачи',h:['ID','Задача','ID клиента','Клиент','ID сделки','Ответственный','Приоритет','Срок','Исходный срок','Выполнена','Дата выполнения'],r:S.tasks.map(t=>[t.id,t.title,t.clientId||'',C(t.clientId)?.name||'',t.dealId||'',uname(t.assignee),PRN[t.priority]||'',I(t.deadline),I(t.origDeadline),t.done?'да':'нет',I(t.doneAt)])},

}
// --- XLSX без библиотек (ZIP без сжатия, фиксированная дата — одинаковые данные дают одинаковый файл) ---
const GH_CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function ghZip(files,type){const enc=new TextEncoder(),parts=[],cd=[];let off=0;const tm=0,dt=33;
 files.forEach(f=>{const nm=enc.encode(f.name),data=f.data,crc=ghCrc(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(h.buffer),nm,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+data.length});

function ghXlsx(sheets){const enc=new TextEncoder();
