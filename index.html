  files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:enc.encode(`${H}<worksheet xmlns="${NS}spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${w.map((x,ci)=>`<col min="${ci+1}" max="${ci+1}" width="${x}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>cell(v,ri,ci,ri===0)).join('')}</row>`).join('')}</sheetData></worksheet>`)});
  return sname(s.n)});
 const ct=`${H}<Types xmlns="${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${names.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
 const rels=`${H}<Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
 const wb=`${H}<workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><sheets>${names.map((n,i)=>`<sheet name="${X(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;
 const wbr=`${H}<Relationships xmlns="${NS}package/2006/relationships">${names.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${names.length+1}" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
 const sty=`${H}<styleSheet xmlns="${NS}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
 return ghZip([{name:'[Content_Types].xml',data:enc.encode(ct)},{name:'_rels/.rels',data:enc.encode(rels)},{name:'xl/workbook.xml',data:enc.encode(wb)},{name:'xl/_rels/workbook.xml.rels',data:enc.encode(wbr)},{name:'xl/styles.xml',data:enc.encode(sty)},...files],'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function ghExpXlsx(){const b=ghXlsx(ghTables()),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`dsrc_crm_${TODAY()}.xlsx`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
// --- слияние изменений других компьютеров ---
function ghRebind(){if(REAL){const r=U(REAL.id);if(r)REAL=r}if(ME){const m=U(ME.id);if(m)ME=m;else{toast('Вашей учетной записи нет в общей базе — войдите заново','warn');setTimeout(logout,300)}}}
async function ghPull(dir){const me=ghNode(),before=JSON.stringify(S);let n=0;
 for(const node of await ghList(dir,'data/nodes')){if(node===me)continue;
  const txt=await ghRead(dir,`data/nodes/${node}.json`);if(txt===null)continue;const t=ghN(txt);
  const seen=await ghKV.get('seen:'+node);if(seen===t)continue;
  let theirs;try{theirs=JSON.parse(t)}catch(e){continue}if(!theirs||!Array.isArray(theirs.users))continue;
  S=merge3(seen?JSON.parse(seen):undefined,S,theirs);await ghKV.set('seen:'+node,t);n++}
 if(n){migrate();if(JSON.stringify(S)===before)return 0;ghRebind();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
 return n}
// --- запись своей версии и общих выгрузок ---
async function ghPush(dir,force){const me=ghNode(),clean=JSON.stringify(ghClean(),null,1);
 if(!force&&(await ghKV.get('mine'))===clean)return false;
 const at=new Date().toISOString(),day=TODAY(),T=ghTables(),csv=t=>'﻿'+[csvRow(t.h),...t.r.map(csvRow)].join('\r\n');
 await ghWrite(dir,`data/nodes/${me}.json`,clean);
 await ghWrite(dir,`data/meta/${me}.json`,JSON.stringify({node:me,at,by:ME?ME.login:'',appVer:APPVER},null,1));
 await ghWrite(dir,'data/latest/dsrc_crm.json',clean);
 for(const t of T)await ghWrite(dir,`data/latest/${t.f}.csv`,csv(t));
 await ghWrite(dir,'data/latest/dsrc_crm.xlsx',ghXlsx(T));
 await ghWrite(dir,'data/latest/meta.json',JSON.stringify({exportedAt:at,by:ME?ME.login:'',node:me,appVer:APPVER,counts:Object.fromEntries(T.map(t=>[t.f,t.r.length]))},null,1));
 await ghWrite(dir,`data/history/dsrc_crm_${day}.json`,clean);
 await ghWrite(dir,`data/backup/dsrc_crm_full_${day}.json`,JSON.stringify(S,null,1));
 await ghKV.set('mine',clean);ghLS.set('dsrc_repo_at',at);ghLS.set('dsrc_repo_dir',dir.name);return true}
// --- новая версия кода из GitHub ---
async function ghCode(dir){const t=await ghRead(dir,'index.html');if(!t)return;const m=t.match(/const APPVER='([^']*)'/);
 if(!m||m[1]===APPVER||GH.ver===m[1])return;GH.ver=m[1];
 const b=document.createElement('div');b.id='ghNew';b.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:var(--card,#1b2440);color:var(--text,#fff);border:1px solid var(--acc,#4ad);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:14px';
 b.innerHTML=`<span>Из GitHub пришла новая версия CRM: <b>${esc(m[1])}</b></span><button class="btn pri sm" onclick="location.reload()">Обновить</button><button class="btn sm" onclick="this.parentNode.remove()">Позже</button>`;
 document.getElementById('ghNew')?.remove();document.body.appendChild(b)}
// --- основной цикл ---
function ghDot(k,err){GH.state=k;GH.err=err||'';const d=document.getElementById('ghBtn');if(!d)return;
 const c={off:'var(--mut,#8a94ad)',ok:'var(--ok,#2bb673)',sync:'var(--warn,#e0a000)',bad:'var(--bad,#d93f57)'}[k];
 d.querySelector('i').style.background=c;
 d.title={off:'GitHub: папка не подключена — нажмите, чтобы подключить',ok:'GitHub: синхронизировано '+ghWhen(),sync:'GitHub: синхронизация…',bad:'GitHub: ошибка — '+GH.err}[k]}
function ghWhen(){const a=ghLS.get('dsrc_repo_at');if(!a)return '';const d=new Date(a);return `${fd(iso(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
async function ghSync(silent,force){
 if(SRV||!GH.dir||GH.busy||!ME)return;
 if(silent&&(modal.classList.contains('on')||DR))return;
 GH.busy=true;ghDot('sync');
 try{
  if(!await ghPerm(GH.dir,!silent)){ghDot('off');if(!silent)toast('Нет доступа к папке','bad');return}
  const n=await ghPull(GH.dir);
  if(n){render();refreshDrawer();toast(`Получены изменения с других компьютеров: ${n}`)}
  const w=await ghPush(GH.dir,force);
  await ghCode(GH.dir);ghDot('ok');
  if(!silent)toast(w||n?'Синхронизировано: данные в папке обновлены':'Синхронизировано: изменений нет');
  if(PAGE==='settings'&&(n||!silent))render();
 }catch(e){ghDot('bad',e.message||String(e));if(!silent)toast('Синхронизация не удалась: '+(e.message||e),'bad')}
 finally{GH.busy=false}}
async function ghConnect(pick){
 if(SRV)return;if(!ME||ro())return toast('Недоступно в режиме просмотра','bad');
 if(!window.showDirectoryPicker)return toast('Этот браузер не умеет работать с папкой. Откройте CRM в Chrome или Edge','bad');
 try{let h=pick?null:(GH.dir||await ghKV.get('dir'));
  if(!h||!await ghPerm(h,true)){h=await window.showDirectoryPicker({id:'dsrc-repo',mode:'readwrite'})}
  try{await h.getFileHandle('sync.ps1')}catch(e){return toast(`В папке «${h.name}» нет sync.ps1 — выберите корневую папку репозитория`,'bad')}
  GH.dir=h;await ghKV.set('dir',h);
  if(!ghLS.get('dsrc_repo_init')){const others=(await ghList(h,'data/nodes')).filter(n=>n!==ghNode());
   if(others.length)return ghJoinForm(others.length);ghLS.set('dsrc_repo_init','1')}
  await ghSync(false,true)}
 catch(e){if(!e||e.name!=='AbortError')toast('Ошибка: '+(e&&e.message||e),'bad')}}
// --- первое подключение компьютера, когда в репозитории уже есть данные ---
function ghJoinForm(k){openModal('Подключение к общей базе в GitHub',`<p>В репозитории уже есть данные с других компьютеров: <b>${k}</b>.</p>
 <p class="mut small"><b>Взять из репозитория</b> — база этого компьютера заменяется общей базой из GitHub. Подходит для нового компьютера (здесь демо-данные или пусто).<br><br><b>Объединить</b> — к общей базе добавляются записи этого компьютера. Подходит, если здесь уже велась настоящая работа.<br><br>Пароли остаются свои на каждом компьютере: пользователи, созданные на другом компьютере, смогут войти здесь после того, как Admin задаст им пароль на этом компьютере.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn pri" onclick="ghJoin('take')">Взять из репозитория</button><button class="btn" onclick="ghJoin('merge')">Объединить</button></div>`,null)}
async function ghJoin(kind){closeModal();const dir=GH.dir;if(!dir)return;GH.busy=true;ghDot('sync');
 try{const me=ghNode(),pw=Object.fromEntries(S.users.filter(u=>u.pw).map(u=>[u.id,u.pw])),list=[];
  for(const n of (await ghList(dir,'data/nodes')).filter(x=>x!==me)){const t=ghN(await ghRead(dir,`data/nodes/${n}.json`)||'');let x=null;try{x=JSON.parse(t)}catch(e){}
   if(!x||!Array.isArray(x.users))continue;let at='';try{at=JSON.parse(await ghRead(dir,`data/meta/${n}.json`)||'{}').at||''}catch(e){}list.push({n,t,x,at})}
  if(!list.length)throw new Error('файлы других компьютеров не читаются');
  list.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  if(kind==='take'){S=JSON.parse(JSON.stringify(list[0].x));list.slice(1).forEach(s=>{S=merge3(undefined,S,s.x)});S.users.forEach(u=>{if(!u.pw&&pw[u.id])u.pw=pw[u.id]})}
  else list.forEach(s=>{S=merge3(undefined,S,s.x)});
  for(const s of list)await ghKV.set('seen:'+s.n,s.t);
  migrate();ghRebind();ghLS.set('dsrc_repo_init','1');try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  log('Подключение к GitHub',kind==='take'?'Взята общая база из репозитория':'База объединена с общей');
  GH.busy=false;await ghSync(false,true);render();refreshDrawer()}
 catch(e){GH.busy=false;ghDot('bad',e.message||String(e));toast('Не удалось подключиться: '+(e.message||e),'bad')}}
function ghAutoSet(on){ghLS.set('dsrc_repo_auto',on?'1':'0');toast(on?'Автосинхронизация включена':'Автосинхронизация выключена')}
// --- кнопка в шапке и карточка в «Данные» ---
function ghCard(){if(SRV)return '';const node=ghNode(),con=!!GH.dir;
 return `<div class="card"><h3>Синхронизация с GitHub</h3><p class="mut small">Данные этого компьютера сохраняются в папку репозитория, изменения с других компьютеров подтягиваются оттуда же. В GitHub данные отправляет <b>sync.bat</b> или задача по расписанию. Пароли в GitHub не уходят. Работает в Chrome и Edge.</p>
 <button class="btn pri" onclick="ghConnect()">⇅ ${con?'Синхронизировать сейчас':'Подключить папку репозитория'}</button> <button class="btn" onclick="ghConnect(true)">Другая папка</button> <button class="btn" onclick="ghExpXlsx()">Все таблицы (.xlsx)</button>
 <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" style="width:auto" ${ghAutoOn()?'checked':''} onchange="ghAutoSet(this.checked)"> Автосинхронизация (после изменений и раз в минуту)</label>
 <p class="mut small">Компьютер: <b>${esc(node)}</b> · папка: ${con?'«'+esc(GH.dir.name)+'» подключена':'не подключена'}${ghLS.get('dsrc_repo_at')?' · последняя синхронизация: '+ghWhen():''}${GH.state==='bad'?'<br><span style="color:var(--bad)">Ошибка: '+esc(GH.err)+'</span>':''}</p></div>`}
(function ghInit(){
 if(typeof S==='undefined')return;
 const _save=save;save=function(){_save();if(GH.dir&&!SRV&&ghAutoOn()){clearTimeout(GH.t);GH.t=setTimeout(()=>ghSync(true),15000)}};
 const _rs=rSettings;rSettings=function(){const h=_rs();return h.startsWith('<div class="grid g3">')?h.replace('<div class="grid g3">','<div class="grid g3">'+ghCard()):h};
 const _boot=boot;boot=function(){_boot();ghAuto()};
 const dot=document.getElementById('srvdot');
 if(dot){const b=document.createElement('button');b.id='ghBtn';b.className='btn ghost tbtn';b.style.cssText='display:flex;gap:6px;align-items:center;font-size:13px';
  b.innerHTML='<i style="width:9px;height:9px;border-radius:50%;display:inline-block"></i>GitHub';b.onclick=()=>ghConnect();dot.parentNode.insertBefore(b,dot);ghDot('off')}
 setInterval(()=>{if(ghAutoOn())ghSync(true)},60000);
 window.addEventListener('focus',()=>{if(ghAutoOn())ghSync(true)});
 if(ME)setTimeout(ghAuto,0);
})();
async function ghAuto(){if(SRV){const b=document.getElementById('ghBtn');if(b)b.style.display='none';return}
 if(GH.dir||!ghLS.get('dsrc_repo_init'))return;
 try{const h=await ghKV.get('dir');if(!h)return;
  if(await ghPerm(h,false)){GH.dir=h;ghSync(true)}
  else toast('GitHub: нажмите кнопку «GitHub» вверху, чтобы снова открыть доступ к папке','warn')}catch(e){}}
</script>
