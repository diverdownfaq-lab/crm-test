const KB_SEED={"cats": [{"id": "crm", "name": "Работа в CRM", "order": 1}, {"id": "stages", "name": "Этапы воронки", "order": 2}, {"id": "sales", "name": "Продажи и переговоры", "order": 3}, {"id": "services", "name": "Услуги DSRC", "order": 4}, {"id": "templates", "name": "Шаблоны писем", "order": 5}, {"id": "suppliers", "name": "Работа с поставщиками", "order": 6}, {"id": "rules", "name": "Регламенты", "order": 7}], "articles": [{"id": "kb_start", "key": "start", "cat": "crm", "title": "С чего начать", "body": "DSRC CRM — система учета клиентов, проектов (сделок), договоров и задач DSRC.\n\n## Вход\n- Логин в формате «первая буква имени.фамилия», например d.kumarova: латиница, цифры, точка. Регистр букв при входе не важен.\n- Пароль — не короче 6 символов.\n- Стартовый пароль выдает Admin. Смените его сразу после первого входа: щелчок по своему имени в правом верхнем углу → «Мой профиль и пароль».\n- Если CRM пишет «Учетная запись отключена» — обратитесь к Admin.\n\n## Разделы меню\n| Раздел | Для чего | Кому доступен |\n| --- | --- | --- |\n| Дашборд | сводка на сегодня: воронка, что требует внимания, распределение задач, команда | всем |\n| Воронка | сделки по этапам: перетаскивание или кнопки ◀ ▶ ✕ на карточке | всем (двигать — по правам) |\n| Клиенты и лиды | все компании, ответственные, последний контакт, импорт реестра | всем |\n| Договоры | реестр договоров и сроков | всем |\n| Задачи | свои и командные задачи, фильтры по статусу, SLA | всем |\n| База знаний | инструкции, этапы воронки, регламенты, шаблоны | всем |\n| Согласования | запросы на возврат этапа, перенос срока и смену приоритета | всем, кроме Viewer (User видит свои запросы) |\n| Журнал действий | кто, когда и что изменил | Admin, User-approver |\n| Пользователи | учетные записи, роли, передача дел | Admin |\n| Данные | выгрузки в Excel, шаблон импорта; у Admin — резервная копия и настройки | Admin, User-approver |\n\n## Полезно знать\n- **Ctrl + K** — быстрый поиск клиента, сделки, статьи или команды.\n- **Меню профиля** — щелчок по своему имени в правом верхнем углу: «Мой профиль и пароль» и «Выйти».\n- Значок **?** рядом с названием этапа в воронке открывает статью об этом этапе.\n- Колокольчик 🔔 в шапке — уведомления о назначениях, задачах и решениях по запросам.", "order": 1}, {"id": "kb_roles", "key": "roles", "cat": "crm", "title": "Роли и права", "body": "Просматривать данные могут все роли. Различия — в том, кто что меняет и что требует согласования.\n\n| Действие | Admin | User-approver (руководитель группы) | User | Viewer |\n| --- | --- | --- | --- | --- |\n| Просмотр всех данных | да | да | да | да |\n| Создание клиентов и задач | да | да | да | — |\n| Создание сделок | да, на любом этапе кроме «Успешно»/«Отказ» | да, на любом этапе кроме «Успешно»/«Отказ» | только по своим и свободным клиентам, на этапе «Лид» или «Квалификация» | — |\n| Импорт реестра | да | да | — | — |\n| Редактирование чужих сделок и задач | да | да | только свои | — |\n| Договоры | да | да | по своим клиентам | — |\n| Назначение ответственного | да | да | свободные и свои лиды | — |\n| Возврат этапа назад, перенос срока и смена приоритета задачи | сразу | сразу | по запросу | — |\n| Согласование запросов | да | да (кроме своих) | — | — |\n| Удаление записей хронологии, клиентов, сделок, договоров | да | — | — | — |\n| Удаление задачи | да | свои поставленные | свои поставленные | — |\n| Возобновление выполненной задачи | да | да | только своей | — |\n| Выгрузка в Excel (CSV) | да | да | — | — |\n| Резервная копия (JSON), чек-листы, SLA, пороги | да | — | — | — |\n| Сброс к демо, очистка базы | да | — | — | — |\n| Журнал действий | да | да | — | — |\n| Пользователи, роли, передача дел | да | — | — | — |\n\nСвой запрос согласовать нельзя никому. Viewer не видит в меню блоки «Контроль» и «Система», User — блок «Система». Хронологию User ведет по своим клиентам и клиентам без ответственного.", "order": 2}, {"id": "kb_dashboard", "key": "dashboard", "cat": "crm", "title": "Дашборд", "body": "Стартовый экран — сводка на сегодня.\n\n- **Воронка** — сумма активных сделок.\n- **Взвешенный прогноз** — сумма сделок × вероятность этапа (Лид 5%, Квалификация 15%, КП 30%, Переговоры 50%, Тех. соглашение 70%, Договор 90%).\n- **Договоры** — подписанные и исполненные.\n- **На согласовании** — запросы, ожидающие решения.\n\n## Требует внимания\nПросроченные задачи, сделки без движения более 14 дней, клиенты с активной сделкой без контакта более 30 дней, договоры со сроком менее 60 дней, нераспределенные лиды. У каждой строки виден ответственный; руководитель может отфильтровать блок по сотруднику.\n\n## Распределение задач\nЦветная полоса и плитки по статусам (Просрочено, Сегодня, Ближайшие 7 дней, Позже, Выполнено), ниже — таблица по каждому сотруднику. Щелчок по плитке или цифре открывает «Задачи» с этим статусом. Переключатель «Команда / Мои».\n\n## Команда и последние действия\n- **Команда** — сделки, суммы, просрочки и процент задач «в срок» по каждому сотруднику. У Admin и User-approver щелчок открывает действия сотрудника в журнале.\n- **Последние действия** (Admin, User-approver) — раскрываются кнопкой «Показать еще», полный список — «Весь журнал →».\n- **Мои уведомления** (User, Viewer) — последние уведомления вместо «Последних действий».", "order": 3}, {"id": "kb_pipeline", "key": "pipeline", "cat": "crm", "title": "Воронка: как двигать сделки", "body": "Сделки идут по этапам: Лид → Квалификация → КП направлено → Переговоры → Тех. соглашение → Договор → Успешно / Отказ. Что значит каждый этап — в рубрике «Этапы воронки».\n\n## Вперед — только на следующий этап\n1. Перетащите карточку в следующий столбец или нажмите на ней кнопку с названием следующего этапа «… ▶». Пропускать этапы нельзя.\n2. Отметьте все пункты чек-листа этапа.\n3. Напишите комментарий — что сделано. Он попадет в хронологию и в справку.\n4. С этапа «КП направлено» обязательна сумма сделки.\n\n## Назад — с причиной\nКнопка ◀ на карточке или перетаскивание назад.\n- Admin и User-approver возвращают сразу, указав причину.\n- User отправляет запрос на согласование: сделка остается на месте с пометкой «⏳ запрошен возврат».\n\n## Успешно\nПеревести сделку в «Успешно» можно только после того, как в разделе «Договоры» внесен подписанный договор по этой сделке.\n\n## Отказ\nКнопка ✕ на карточке — из любого этапа, причина обязательна. Вернуть из «Отказа» — кнопка «◀ в «Лид»».\n\nКнопки на карточке видят только те, кто может вести эту сделку.\n\n## Новая сделка\n- User заводит сделку по своему клиенту или клиенту без ответственного — во втором случае он становится ответственным за клиента.\n- User создает сделку на этапе «Лид» или «Квалификация»; руководитель — на любом этапе, кроме «Успешно» и «Отказ» (для переноса текущих проектов).\n- С этапа «КП направлено» сумма обязательна.\n\n## Следующий шаг и срок\nВ карточке сделки и при переходе на этап есть поля «Следующий шаг» и «Срок шага».\n- Если указан срок — ответственному по клиенту ставится задача с меткой «шаг сделки». Она видна в «Задачах» и на дашборде.\n- На карточке в воронке: «→ шаг · до ДД.ММ.ГГГГ»; просроченный шаг — красным.\n- Когда задачу отмечают выполненной, CRM спрашивает **результат** (попадет в хронологию и в справку) и **новый следующий шаг** со сроком. Новый шаг сразу становится новой задачей.\n- Перенос срока шага у User — через согласование, как у обычной задачи.\n- В справке шаг выводится со сроком: «Следующий шаг: … — до ДД.ММ.ГГГГ»; если срок переносили — с пометкой «(первоначальный срок …)». Каждый перенос пишется служебной записью в хронологию («срок шага … перенесен с … на …») — в справке она видна, если включить служебные записи.\n- При смене ответственного по клиенту задача-шаг переходит новому ответственному.\n- Новую сделку открывать не нужно: шаг — это продолжение текущей сделки. Новая сделка — только для нового проекта (например, другой год или другая услуга).\n\n## Причины отказа и паузы\nПричина выбирается из списка (настраивается в «Данные» → «Причины отказа и приостановления»), подробности — по желанию, для «Другое» — обязательно. По причинам строится блок «Почему теряем и откладываем» на дашборде.\n\n## Ожидаемая дата подписания\nПоле в карточке сделки. По нему строится «Прогноз подписания по месяцам» на дашборде и план в отчете за месяц. Если дата прошла, а договор не подписан, сделка появится в «Моем дне».\n\n## Приостановление проекта\nБывает, что проект встает на паузу: заказчик пересматривает бюджет, ждет решения руководства, сменился куратор.\n1. Кнопка паузы (две полоски) на карточке (или перетащите карточку в колонку «В приостановлении»).\n2. Выберите причину из списка и укажите дату напоминания.\n3. Сделка переходит в колонку «В приостановлении», но **этап сохраняется** — на карточке видно «с этапа …».\n4. Ответственному ставится задача «Вернуться к приостановленному проекту» (метка «пауза») на дату напоминания. Когда дата наступила — на карточке «пора вернуться», красным.\n5. Когда задачу отмечают выполненной, CRM спрашивает: **продлить** приостановление (новая дата и комментарий) или **возобновить** проект.\n6. Возобновить можно и раньше — кнопка «Возобновить ▶» на карточке. Проект вернется на тот же этап, комментарий «что изменилось» обязателен.\n\nПриостановленные сделки не входят во взвешенный прогноз и в «Воронку (активные)» на дашборде — они показаны отдельно («на паузе»). Они не попадают в «застой» и «нет контакта». В справке: «Текущий этап: … — проект приостановлен с …. Причина: …. Возврат к вопросу — …». Из паузы можно сразу перевести в «Отказ» (✕).\n\n## Метки на карточке\n- «Х дн.» — сколько дней сделка на этапе; желтая — более 14 дней.\n- «не назначен» — у клиента нет ответственного.\n- Зеленые метки в карточке сделки — выполненные чек-листы (наведите, чтобы увидеть пункты).", "order": 4}, {"id": "kb_clients", "key": "clients", "cat": "crm", "title": "Клиенты и лиды", "body": "## Ответственный\n**Один клиент — один ответственный.** Он ведет все активные сделки клиента. В карточке сделки ответственного не выбирают — он берется из клиента.\n\nПри смене ответственного все активные сделки переходят к новому сотруднику, в хронологии появляется служебная запись, в карточке сделки — «Ранее вели: …». Закрытые сделки остаются за тем, кто их вел.\n\n## БИН и дубли\n- БИН проверяется по контрольной цифре: опечатку CRM не пропустит. При импорте реестра такие БИН записываются с замечанием в отчете.\n- Клиента с тем же БИН или тем же названием завести нельзя.\n- Если название похоже на существующее («ТОО «Альфа»» и «Альфа ТОО»), CRM покажет предупреждение. Если это другая компания — нажмите «Сохранить» еще раз.\n\n## Теги\nПоле «Теги» в карточке клиента, через запятую: «квазигос», «реестр 150», «приоритет 2027». Фильтр по тегу — в списке клиентов, поиск тоже ищет по тегам. В шаблоне импорта можно добавить колонку «Теги».\n\n## Последний контакт\nДата самой свежей ручной записи хронологии: событие, комментарий при переходе на этап, подписание договора. Служебные записи не считаются.\n- до 14 дней — обычный цвет;\n- 15–30 дней — желтый;\n- более 30 — красный;\n- «нет контактов» — лид еще не отработан.\n\nЩелчок по заголовку колонки сортирует: давно без контакта — наверху.\n\n## Импорт реестра (Project Manager, Admin, User-approver)\n1. «Клиенты и лиды» → «⇩ Шаблон» — скачайте шаблон.\n2. Заполните в Excel колонки: Наименование, БИН, Отрасль, Статус (Лид, Клиент, Партнер, Неактивен), Регион, Ответственный (логин, например a.ayazbayeva, или имя), Заметки. Обязательна только колонка «Наименование».\n3. Сохраните как обычный файл Excel (.xlsx) или CSV — подходит любая кодировка.\n4. «Импорт реестра (Excel / CSV)» → выберите файл.\n5. CRM покажет итог: сколько добавлено, какие строки пропущены как дубли (по названию и БИН) и где есть замечания (БИН не 12 цифр, неизвестный статус или ответственный).\n\nКлиенты со статусом «Лид» получают сделку «Первичный контакт». Назначенные ответственные получают уведомление.", "order": 5}, {"id": "kb_contracts", "key": "contracts", "cat": "crm", "title": "Договоры", "body": "Реестр договоров: номер, контрагент, предмет, дата заключения, сумма, срок, статус (Проект, На согласовании, Подписан, Исполнен, Расторгнут).\n\n- При статусе «Подписан» в хронологию добавляется «договор № … подписан».\n- До окончания срока показывается остаток дней; за 60 дней договор появляется на дашборде.\n- User работает с договорами только по своим клиентам.\n- Номер договора уникален; срок действия не может быть раньше даты заключения; у подписанного договора обязательна дата.\n- Договор, которым подтверждена сделка в «Успешно», нельзя удалить или вернуть в «Проект» / «На согласовании» — сначала верните сделку на этап «Договор». Перевести его в «Исполнен» или «Расторгнут» можно.\n- Ошибочный договор удаляет Admin (с причиной, запись в журнале).\n- Под полем суммы есть подсказка («1,5 млрд ₸ · 1 500 000 000 ₸»), чтобы не ошибиться с нулями.\n\n## Продление\nОтметка «планируется продление» в карточке договора. Такой договор помечен «продление» в реестре, на дашборде и в «Моем дне».\n\n## Этапы оплаты и акты\nКнопка «Этапы оплаты и акты» в карточке договора (или «₸» в карточке клиента).\n- Этап: что (акт, счет, оплата), описание, дата, сумма.\n- За 7 дней до даты этап появляется в «Моем дне» ответственного; просроченный — в «Требует внимания» на дашборде.\n- Галочка — этап выполнен, в хронологию пишется служебная запись.\n- В реестре договоров видно «оплачено … из …» и ближайший этап.\n- Если оплат запланировано больше суммы договора, CRM предупредит.\n- Вести этапы может тот, кто ведет договор; остальные видят их только для просмотра.", "order": 6}, {"id": "kb_tasks", "key": "tasks", "cat": "crm", "title": "Задачи и SLA", "body": "Задачи сгруппированы: Просрочено, Сегодня, Ближайшие 7 дней, Позже, Выполнено. Фильтры сверху: «Мои / Все задачи команды», сотрудник и статус (кнопки с количеством задач). «Все задачи команды» показывает задачи всех сотрудников; щелчок по задаче открывает ее карточку (исполнитель, кто поставил, сроки, SLA). На дашборде блок «Распределение задач» показывает те же группы по команде и по каждому сотруднику.\n\n## SLA\n| Приоритет | Нормативный срок |\n| --- | --- |\n| Высокий | 1 рабочий день |\n| Средний | 3 рабочих дня |\n| Низкий | 7 рабочих дней |\n\n- При создании задачи срок подставляется по SLA. Для задач «на будущее» срок можно поставить позже — появится пометка «срок позже SLA».\n- У выполненных задач — отметка «в срок» или «с опозданием». Сравнение идет с **первоначальным** сроком, даже если его потом перенесли.\n- Показатель «в срок, %» по каждому сотруднику — в блоке «Команда» на дашборде.\n\n## Создание и удаление\n- Срок новой задачи не может быть в прошлом.\n- Удалить задачу может Admin или тот, кто ее поставил (с причиной).\n- Возобновить выполненную задачу может исполнитель или руководитель.\n\n## Шаг сделки\nЗадача с меткой «шаг сделки» создается из поля «Следующий шаг» сделки. При ее выполнении CRM просит указать результат и новый шаг — подробнее в [[pipeline]].\n\n## Изменение срока и приоритета\nУ User — через согласование, у Admin и User-approver — сразу. Если задачу выполнили, пока запрос был на согласовании, запрос помечается «неактуален».", "order": 7}, {"id": "kb_approvals", "key": "approvals", "cat": "crm", "title": "Согласования", "body": "Возврат сделки на предыдущий этап, перенос срока и смена приоритета задачи у User выполняются после решения Admin или User-approver.\n\n1. Сотрудник делает изменение и указывает причину.\n2. Запрос попадает в «Согласования», согласующим приходит уведомление.\n3. Согласующий нажимает «Одобрить» (изменение применяется) или «Отклонить» с комментарием.\n4. Сотрудник получает уведомление о решении.\n5. Ошибочное решение исправляется кнопкой «Изменить решение» с причиной. История решений сохраняется. Если сделку или задачу уже изменили после решения, CRM предупредит и ничего не изменит.\n\nСвой запрос согласовать нельзя.", "order": 8}, {"id": "kb_chronology", "key": "chronology", "cat": "crm", "title": "Хронология и справка для руководства", "body": "## Как вести хронологию\nВ карточке клиента — «+ событие» (или клавиша E): тип (встреча, звонок, письмо, документ / КП, прочее), дата, сделка, что сделано. Дата не может быть в будущем — для планов есть задачи и следующий шаг. Тип нужен для отчета за месяц (встречи и звонки по сотрудникам). Пишите коротко и безлично:\n- «направлено коммерческое предложение»\n- «проведена встреча, получены замечания к КП»\n- «направлено тех. соглашение. На рассмотрении у заказчика»\n- «ожидается подписание договора»\n\nCRM сама поставит точку и сделает первую букву строчной (сокращения вроде «КП» не трогает).\n\nХронология — это история: при возврате этапа записи не стираются. Ошибочную запись удаляет Admin (ссылка «удалить», с причиной; удаление пишется в журнал).\n\n## Справка\nКарточка клиента → «Справка» → выберите сделку → «Копировать» или «Word».\n\n| Часть справки | Источник |\n| --- | --- |\n| Заголовок | название сделки и клиента |\n| Договор | раздел «Договоры»; нет договора — «Договор: не заключен» |\n| Этап, сумма, ответственный, следующий шаг | карточка сделки |\n| Хронология | ручные записи от старых к новым; служебные — только если включены |\n\n> Справка хороша настолько, насколько аккуратно ведется хронология.", "order": 9}, {"id": "kb_audit", "key": "audit", "cat": "crm", "title": "Журнал действий", "body": "Журнал фиксирует каждое действие: кто, когда и что изменил. Записи нельзя изменить или удалить.\n\nЖурнал видят Admin и User-approver.\n\n- Фильтры: сотрудник, тип действия, период, поиск по тексту.\n- Счетчики «Кто сколько действий» и «По типам» — щелчок включает фильтр.\n- Выгрузка CSV учитывает выбранные фильтры.", "order": 10}, {"id": "kb_notifications", "key": "notifications", "cat": "crm", "title": "Уведомления", "body": "| Событие | Кто получает |\n| --- | --- |\n| Назначен ответственным по клиенту | назначенный |\n| Поставлена или передана задача | исполнитель |\n| Задача выполнена | тот, кто ее поставил |\n| Сделку перевел на другой этап другой сотрудник | ответственный |\n| Новый запрос на согласование | согласующие |\n| Решение по запросу (в т.ч. измененное) | автор запроса |\n| Переданы дела отключенного сотрудника | преемник |\n\nВ макете уведомления видны внутри CRM. Уведомления на почту или в Telegram — в серверной версии.", "order": 11}, {"id": "kb_offboarding", "key": "offboarding", "cat": "crm", "title": "Передача дел при отключении сотрудника", "body": "Сотрудника не удаляют, а отключают — его история остается в системе. Роль Viewer нельзя назначить сотруднику, у которого есть клиенты или задачи: сначала передайте дела.\n\n1. «Пользователи» → «Отключить».\n2. Если у сотрудника есть клиенты, активные сделки или задачи — откроется окно «Передача дел».\n3. Выберите преемника для всех дел или отдельно по каждому клиенту и задаче.\n4. «Передать и отключить». Дела без преемника можно оставить только с отметкой-подтверждением.\n\n## Что остается как запись\n- журнал действий;\n- служебная запись в хронологии каждого клиента;\n- «Ранее вели: …» в карточке сделки;\n- статус «отключен ДД.ММ.ГГГГ» и ссылка «Дела переданы»;\n- акт передачи дел (Word) с местами для подписей.\n\nЗакрытые сделки и выполненные задачи остаются за сотрудником — для истории и статистики.", "order": 12}, {"id": "kb_data", "key": "data", "cat": "crm", "title": "Данные: выгрузки и резервная копия", "body": "- **Excel:** «Данные» → клиенты, сделки, договоры в CSV.\n- **Резервная копия:** «Данные» → «Выгрузить JSON» (Admin). Делайте хотя бы раз в неделю: очистка истории браузера удалит данные.\n- **Восстановление:** «Загрузить» (Admin).\n- **Настройки:** чек-листы этапов, SLA задач, пороги «последнего контакта».\n- **Начать с чистой базы** — удаляет клиентов, сделки, договоры, задачи и запросы; доступно только Admin.\n- **Сбросить к демо** — заменяет клиентов, сделки, договоры и задачи демо-данными; пользователи, пароли, журнал и база знаний сохраняются; доступно только Admin.\n- **Причины отказа и приостановления**, **чек-лист онбординга** — настраиваются здесь же.\n\n## Серверная версия\nЕсли CRM открыта по адресу вида `http://…:8080`, база общая для всех сотрудников:\n- изменения сохраняются автоматически и видны коллегам через несколько секунд; точка рядом с колокольчиком: зеленая — сохранено, желтая — сохраняется, красная — нет связи;\n- если двое правят одну запись, разные поля сохраняются оба; пока открыта форма, обновления коллег ждут ее закрытия;\n- в карточке клиента — раздел «Файлы» (КП, договоры, акты, до 25 МБ);\n- сервер каждую ночь делает резервную копию и хранит 30 дней: «Данные» → «Сервер» → «Резервные копии» (Project Manager, Admin);\n- уведомления могут приходить на почту — укажите почту в профиле; рассылку включает администратор сервера;\n- пароли хранятся на сервере отдельно от базы и в выгрузку JSON не попадают.", "order": 13}, {"id": "kb_faq", "key": "faq", "cat": "crm", "title": "Частые вопросы", "body": "| Вопрос | Ответ |\n| --- | --- |\n| Видят ли коллеги мои данные? | В макете база хранится в браузере одного компьютера. Совместная работа — в серверной версии. |\n| Почему нельзя перетащить сделку сразу в «Договор»? | Этапы нельзя пропускать: на каждом заполняется чек-лист. |\n| Почему не переводится в «Успешно»? | Сначала внесите подписанный договор по этой сделке в раздел «Договоры». |\n| Почему не могу завести сделку по клиенту? | User ведет только своих клиентов и клиентов без ответственного. |\n| Карточка не перетаскивается | Используйте кнопки ◀ ▶ ✕ на карточке — на тачпаде перетаскивание часто не срабатывает. Если кнопок нет — у вас нет прав на эту сделку. |\n| Не вижу раздела «Согласования», «Журнал» или «Данные» | Разделы зависят от роли — см. «С чего начать» → «Разделы меню». |\n| Почему сделка не вернулась назад? | У User возврат идет через согласование — проверьте «Согласования». |\n| Где взять стартовый пароль? | У Admin. Сменить — меню профиля (щелчок по имени) → «Мой профиль и пароль». |\n| Пропали данные | Проверьте, тот ли браузер и компьютер. Иначе — загрузить последний JSON. |", "order": 14}, {"id": "kb_stage_pause", "key": "stage_pause", "cat": "stages", "title": "В приостановлении", "body": "## Что это\nПроект временно остановлен по причине, не зависящей от DSRC: заказчик пересматривает бюджет, ждет решения руководства, идет реорганизация, сменился куратор. Это не отказ: интерес у клиента есть, но двигаться сейчас нельзя.\n\n## Что сделать\n- указать причину приостановления (обязательно);\n- поставить дату, когда вернуться к вопросу (обязательно);\n- в дату напоминания связаться с клиентом и решить: продлить паузу или возобновить проект.\n\n## Когда возобновлять\nКогда у клиента появилось решение, бюджет или новый куратор. Проект вернется на тот этап, с которого был приостановлен.\n\n## Частая ошибка\nДержать проект «на паузе» месяцами без контакта. Если интереса нет — переведите в «Отказ» с причиной.\n\nПодробнее — [[pipeline]].", "order": 9}, {"id": "kb_stage_lead", "key": "stage_lead", "cat": "stages", "title": "1. Лид", "body": "## Что это\nКомпания, с которой еще не обсуждали сотрудничество: из реестра крупнейших компаний, входящий запрос, рекомендация.\n\n## Что сделать на этапе\n- назначить ответственного (пока его нет, лид висит в «нераспределенных»)\n- найти контактное лицо\n- провести первый звонок или встречу\n\n## Когда переходить дальше\nПереходите в «Квалификацию», когда состоялся первый разговор с клиентом.\n\n## Частая ошибка\nЛид без ответственного неделями — его никто не ведет.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняет Admin: «Данные» → «Настроить чек-листы».", "order": 1}, {"id": "kb_stage_qual", "key": "stage_qual", "cat": "stages", "title": "2. Квалификация", "body": "## Что это\nПроверка, стоит ли тратить силы: станет ли компания реальным клиентом.\n\n## Что сделать на этапе\n- потребность: есть ли задача, которую решает DSRC\n- кто принимает решение\n- бюджет: есть ли он и примерный размер\n- сроки: когда клиенту это нужно\n\n## Когда переходить дальше\nЕсли все сходится — готовьте КП. Если потребности нет или клиент «просто собирает информацию» — «Отказ» с причиной.\n\n## Частая ошибка\nГотовить КП, не выяснив потребность и бюджет.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняет Admin: «Данные» → «Настроить чек-листы».", "order": 2}, {"id": "kb_stage_kp", "key": "stage_kp", "cat": "stages", "title": "3. КП направлено", "body": "## Что это\nКлиенту отправлено коммерческое предложение.\n\n## Что сделать на этапе\n- указать сумму сделки (обязательно с этого этапа)\n- договориться о сроке обратной связи\n- поставить задачу-напоминание\n\n## Когда переходить дальше\nПереходите в «Переговоры», когда получена обратная связь по КП.\n\n## Частая ошибка\nОтправить КП и ждать без срока — сделка «застревает».\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняет Admin: «Данные» → «Настроить чек-листы».", "order": 3}, {"id": "kb_stage_nego", "key": "stage_nego", "cat": "stages", "title": "4. Переговоры", "body": "## Что это\nОбсуждение условий: объем, цена, сроки, формат работ.\n\n## Что сделать на этапе\n- зафиксировать замечания клиента в хронологии\n- согласовать сроки и бюджет\n- определить, нужно ли тех. соглашение\n\n## Когда переходить дальше\nПереходите дальше, когда условия согласованы.\n\n## Частая ошибка\nУстные договоренности, не записанные в хронологию.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняет Admin: «Данные» → «Настроить чек-листы».", "order": 4}, {"id": "kb_stage_tech", "key": "stage_tech", "cat": "stages", "title": "5. Тех. соглашение", "body": "## Что это\nСогласование технических требований (БТ/ТЗ) и технического соглашения.\n\n## Что сделать на этапе\n- согласовать требования с клиентом и аналитиками DSRC\n- направить тех. соглашение\n- отслеживать статус рассмотрения у заказчика\n\n## Когда переходить дальше\nПереходите в «Договор», когда тех. соглашение согласовано или подписано.\n\n## Частая ошибка\nНе фиксировать, у кого на рассмотрении документ.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняет Admin: «Данные» → «Настроить чек-листы».", "order": 5}, {"id": "kb_stage_contract", "key": "stage_contract", "cat": "stages", "title": "6. Договор", "body": "## Что это\nПодготовка и подписание договора.\n\n## Что сделать на этапе\n- согласовать проект договора с юристами\n- направить договор на подписание\n- подтвердить сумму договора\n\n## Когда переходить дальше\nПереходите в «Успешно», когда договор подписан. Внесите его в раздел «Договоры».\n\n## Частая ошибка\nСделка «Успешно» без договора в реестре.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняет Admin: «Данные» → «Настроить чек-листы».", "order": 6}, {"id": "kb_stage_won", "key": "stage_won", "cat": "stages", "title": "7. Успешно", "body": "## Что это\nДоговор подписан, работа с клиентом переходит в исполнение.\n\n## Что сделать на этапе\n- внести договор в раздел «Договоры» (номер, дата, сумма, срок)\n- определить дату начала работ\n\n## Когда переходить дальше\nСделка закрыта. Клиент со статусом «Лид» автоматически становится «Клиентом».\n\n## Частая ошибка\nЗабыть указать срок договора — CRM не предупредит об окончании.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняет Admin: «Данные» → «Настроить чек-листы».", "order": 7}, {"id": "kb_stage_lost", "key": "stage_lost", "cat": "stages", "title": "8. Отказ", "body": "## Что это\nСделка не состоялась.\n\n## Что сделать на этапе\n- указать причину отказа (обязательно)\n\n## Когда переходить дальше\nПричины отказов помогают понять, что улучшить. Вернуть сделку из «Отказа» можно с причиной (у User — через согласование).\n\n## Частая ошибка\nНе писать настоящую причину.\n\n> Актуальный чек-лист этапа показывается в окне перехода. Его меняет Admin: «Данные» → «Настроить чек-листы».", "order": 8}, {"id": "kb_qual_questions", "key": "qual_questions", "cat": "sales", "title": "Квалификация: вопросы клиенту", "body": "Цель — за один-два разговора понять, есть ли смысл готовить КП.\n\n| Что выяснить | Примерный вопрос |\n| --- | --- |\n| Потребность | Какую задачу вы хотите решить? Как она решается сейчас? |\n| Кто решает | Кто еще участвует в решении? Кто согласует бюджет? |\n| Бюджет | Заложен ли бюджет? В каком году и по какой статье? |\n| Сроки | К какому сроку нужно решение? Что будет, если не успеть? |\n\n> Ответы запишите в хронологию — они понадобятся при подготовке КП и справки.", "order": 1}, {"id": "kb_services_catalog", "key": "services_catalog", "cat": "services", "title": "Каталог услуг (заполнить)", "body": "> Заготовка. Опишите каждую услугу по шаблону ниже. Описывайте нейтрально, без данных конкретных клиентов.\n\n## Передача данных\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:\n\n## Интеграционное решение\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:\n\n## Индивидуальная разработка\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:\n\n## Аналитика / дашборды\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:\n\n## Проверка контрагентов\n- Что это:\n- Кому подходит:\n- Типовые сроки:\n- С чего начать с клиентом:", "order": 1}, {"id": "kb_tpl_kp_reminder", "key": "tpl_kp_reminder", "cat": "templates", "title": "Напоминание клиенту о КП", "body": "> Заготовка — поправьте под стиль DSRC.\n\n**Тема:** Коммерческое предложение DSRC — ваша обратная связь\n\nДобрый день, [Имя Отчество]!\n\n[Дата] мы направили коммерческое предложение по [кратко о задаче]. Подскажите, пожалуйста, удалось ли его рассмотреть? Если есть вопросы или замечания, готовы обсудить их на коротком созвоне в удобное для вас время.\n\nС уважением,\n[Имя Фамилия], [должность]\nТОО «Digital Silk Road Company»", "order": 1}, {"id": "kb_tpl_request_docs", "key": "tpl_request_docs", "cat": "templates", "title": "Запрос требований у клиента", "body": "> Заготовка — поправьте под стиль DSRC.\n\n**Тема:** Запрос исходных требований\n\nДобрый день, [Имя Отчество]!\n\nДля подготовки предложения просим направить:\n- описание задачи и ожидаемого результата;\n- текущие системы и форматы данных;\n- желаемые сроки;\n- контактное лицо с технической стороны.\n\nС уважением,\n[Имя Фамилия], [должность]", "order": 2}, {"id": "kb_suppliers_start", "key": "suppliers_start", "cat": "suppliers", "title": "Работа с поставщиками: с чего начать", "body": "> Проект регламента. Перечень документов и порядок согласования уточните с юристами и бухгалтерией DSRC — затем отредактируйте статью.\n\n## С чего начать\n1. **Потребность.** Что нужно, объем, сроки, ориентировочный бюджет. Согласуйте с руководителем.\n2. **Порядок закупки.** Уточните у ответственного за закупки, нужна ли процедура закупки и в каком порядке она проводится.\n3. **Поиск поставщиков.** Подберите не менее трех поставщиков, чтобы было что сравнить.\n4. **Запрос КП.** Направьте запрос с описанием потребности или технической спецификацией — шаблон: [[tpl_supplier_kp]].\n5. **Сравнение.** Сведите КП в таблицу: цена, сроки, условия оплаты, гарантия, опыт.\n6. **Проверка поставщика** (см. ниже).\n7. **Согласование выбора** с руководителем (служебная записка с таблицей сравнения).\n8. **Договор** — по шаблону DSRC (раздел «Шаблоны договоров»), согласование с юристами, подписание.\n9. **Исполнение и закрытие:** акт выполненных работ или накладная, счет-фактура, оплата.\n\n## Что запросить у поставщика\n| Документ | Зачем |\n| --- | --- |\n| Коммерческое предложение на бланке, с датой, подписью и сроком действия | основание для сравнения и выбора |\n| Справка о государственной регистрации (перерегистрации) | подтверждает, что компания действует |\n| Сведения об отсутствии налоговой задолженности | проверка благонадежности |\n| Свидетельство о постановке на учет по НДС (если плательщик НДС) | для счета-фактуры и расчета цены |\n| Реквизиты: БИН, банк, ИИК, БИК, КБе, юридический адрес | для договора и оплаты |\n| Документ о полномочиях подписанта (приказ или доверенность) | договор подписывает уполномоченное лицо |\n| Лицензии, сертификаты — если вид работ этого требует | подтверждает право выполнять работы |\n\n## Что направить поставщику от DSRC\n- запрос КП или техническую спецификацию;\n- реквизиты DSRC (карточку предприятия);\n- проект договора по шаблону DSRC.\n\n## Как проверить поставщика\n- БИН и статус компании — по открытым государственным сервисам;\n- отсутствие в реестре недобросовестных участников закупок;\n- отзывы и опыт аналогичных работ.\n\n## Шаблоны договоров\n> Ссылки на шаблоны добавляются сюда. Храните шаблоны на сервере или общем диске DSRC; ссылки — вида https://… или file:///….\n\n- Договор поставки товаров — ссылка будет добавлена\n- Договор оказания услуг — ссылка будет добавлена\n- Договор выполнения работ — ссылка будет добавлена\n\n## Частые ошибки\n- Одно КП без сравнения.\n- Работы начаты до подписания договора.\n- КП без даты и срока действия.\n- Нет документа о полномочиях подписанта.", "order": 1}, {"id": "kb_tpl_supplier_kp", "key": "tpl_supplier_kp", "cat": "templates", "title": "Запрос КП у поставщика", "body": "**Тема:** Запрос коммерческого предложения\n\nДобрый день!\n\nТОО «Digital Silk Road Company» рассматривает возможность приобретения [что именно]. Просим направить коммерческое предложение с указанием:\n- стоимости с учетом НДС (или без НДС — укажите);\n- сроков поставки / выполнения;\n- условий оплаты;\n- гарантийных обязательств;\n- срока действия предложения.\n\nОписание потребности (техническая спецификация) — во вложении.\n\nКоммерческое предложение просим направить на бланке организации, с подписью уполномоченного лица, до [дата].\n\nС уважением,\n[ФИО, должность, телефон]", "order": 3}, {"id": "kb_myday", "key": "myday", "cat": "crm", "title": "Мой день", "body": "Первый экран после входа — все, что требует внимания сегодня.\n\n- **Сегодня и просрочено** — ваши задачи со сроком сегодня и раньше. Галочка — выполнено.\n- **Ближайшие 7 дней** — задачи на неделю.\n- **Ждут моего решения** (для руководителей) или **Мои запросы на согласовании**.\n- **Мои проекты на паузе** — с датой напоминания; когда дата наступила — «пора вернуться».\n- **Ожидаемая дата подписания прошла** — уточните дату в карточке сделки.\n- **Сделки без следующего шага** — задайте шаг и срок.\n- **Давно без контакта** — активные клиенты без записей в хронологии дольше порога.\n- **Договоры** — истекают в течение 30 дней; **Оплаты и акты** — этапы на ближайшую неделю и просроченные.\n\nПустые блоки не показываются. Viewer «Мой день» не видит — у него нет задач.", "order": 1}, {"id": "kb_orders", "key": "orders", "cat": "crm", "title": "Протокольные поручения", "body": "Раздел «Поручения» — учет поручений из протоколов совещаний.\n\n## Как добавить\n«+ Поручение» (Project Manager, Admin, User-approver): протокол или совещание, дата протокола, № пункта, текст поручения, исполнитель, срок, при необходимости клиент. Название протокола подставляется из предыдущего поручения.\n\n## Что происходит\n- Исполнителю ставится задача с меткой «поручение» и высоким приоритетом, приходит уведомление.\n- Перенос срока — через задачу («Изменить срок / приоритет»); у User — по согласованию.\n- Когда задачу отмечают выполненной, CRM просит **отчет об исполнении** — он виден в таблице поручений и в своде. Если поручение по клиенту, запись попадает в хронологию.\n- Ненужное поручение руководитель **снимает** с причиной — задача удаляется.\n\n## Статусы\nВ работе, Срок близко (3 дня и меньше), Просрочено, Исполнено, Снято.\n\n## Свод исполнения\n«⇩ Свод исполнения (Word)» — таблица по протоколам: поручение, исполнитель, срок, статус, исполнение. Учитывает выбранные фильтры.", "order": 12}, {"id": "kb_reports", "key": "reports", "cat": "crm", "title": "Сводная справка и отчет за месяц", "body": "Кнопки в правом верхнем углу дашборда.\n\n## Сводная справка по проектам\nВсе активные проекты: этап, сумма, ответственный, следующий шаг со сроком, пауза, ожидаемое подписание и последние события.\n- Фильтр по ответственному, группировка по этапам или по ответственным.\n- Количество последних событий по проекту — 0–3.\n- Копировать или выгрузить в Word.\n\nДоступна всем, кроме Viewer.\n\n## Отчет за месяц\nProject Manager, Admin, User-approver. Выберите месяц — отчет строится автоматически:\n1. Основные показатели: новые клиенты и сделки, переходы по этапам, выигрыши, отказы, паузы, подписанные договоры, оплаты, задачи (в срок, %), поручения.\n2. Выигранные проекты и подписанные договоры.\n3. Отказы с причинами.\n4. Работа сотрудников: проекты в работе, встречи, звонки, записи в хронологии, задачи, в срок, выиграно.\n5. План на следующий месяц — сделки с ожидаемой датой подписания.\n\nЧтобы отчет был точным: указывайте тип события (встреча, звонок…), причину отказа из списка и ожидаемую дату подписания.", "order": 13}, {"id": "kb_onboarding", "key": "onboarding", "cat": "crm", "title": "Онбординг нового сотрудника", "body": "«Пользователи» → кнопка «Онбординг» у сотрудника (Project Manager, Admin).\n\n- Дата выхода, подразделение, наставник, контакты, зона ответственности.\n- Чек-лист: служебная записка, почта и учетная запись, доступы, наставник, встреча с руководителем, база знаний, первые задачи, представление коллективу. Дата отметки сохраняется. Прогресс виден в списке пользователей («Онбординг · 3/8»).\n- **⇩ СЗ на создание учетных записей** — служебная записка в Word со списком доступов.\n- **⇩ Представление сотрудника** — короткое представление для коллектива в Word.\n- Пункты чек-листа настраиваются кнопкой «Настроить чек-лист».\n\nПорядок: создайте пользователя → откройте «Онбординг» → выгрузите СЗ → отмечайте пункты по мере выполнения.", "order": 14}, {"id": "kb_hotkeys", "key": "hotkeys", "cat": "crm", "title": "Горячие клавиши, фильтры, телефон", "body": "## Горячие клавиши\n| Клавиша | Действие |\n| --- | --- |\n| N | новая сделка |\n| T | новая задача |\n| C | новый клиент / лид |\n| E | событие в хронологию (в открытой карточке клиента) |\n| / или Ctrl+K | поиск и команды |\n| 1 … 6 | Мой день, Дашборд, Воронка, Клиенты, Задачи, Поручения |\n| Esc | закрыть окно |\n| ? | подсказка по клавишам |\n\nРаботают в любой раскладке, когда курсор не в поле ввода.\n\n## Сохраненные фильтры\nВ «Воронке», «Клиентах», «Задачах» и «Поручениях» есть список «★ Фильтры»: настройте фильтры → «+ Сохранить текущий фильтр…» → дайте название. Фильтры у каждого пользователя свои.\n\n## С телефона\nНа узком экране меню открывается кнопкой ☰, воронка показывается столбцом, карточки и окна — во весь экран.", "order": 15}, {"id": "kb_rules_crm", "key": "rules_crm", "cat": "rules", "title": "Регламент ведения CRM (проект)", "body": "> Проект регламента — согласовать с руководителем.\n\n1. Событие по клиенту вносится в хронологию в день, когда оно произошло.\n2. У каждой сделки с этапа «КП направлено» указана сумма.\n3. У каждого клиента есть ответственный; нераспределенные лиды распределяются в течение 3 рабочих дней.\n4. Сделка без движения более 14 дней — повод для действия или комментария.\n5. Подписанный договор вносится в раздел «Договоры» в день подписания.\n6. Изменения сроков и возвраты этапов — только с причиной.\n7. Резервная копия базы — еженедельно (Admin).", "order": 1}]};
function seedKb(){const k=JSON.parse(JSON.stringify(KB_SEED));k.articles.forEach(a=>{a.createdAt=TODAY();a.updatedAt=TODAY();a.updatedBy='system'});return k}
// обновить системные статьи, которые никто не редактировал; добавить новые
function updateKb(){if((S.kb.ver||1)>=KB_VER)return;const k=seedKb();k.articles.forEach(n=>{const o=S.kb.articles.find(x=>x.key===n.key);if(!o)S.kb.articles.push(n);else if(o.updatedBy==='system'&&!(o.hist||[]).length){o.title=n.title;o.body=n.body;o.updatedAt=TODAY()}});k.cats.forEach(c=>{if(!S.kb.cats.some(x=>x.id===c.id))S.kb.cats.push(c)});S.kb.ver=KB_VER}

function spravka(cid){
 const ds=S.deals.filter(d=>d.clientId===cid);
 openModal('Справка для руководства',`<p class="mut small">Формируется автоматически: в начале — информация о договоре, в конце — хронология.</p>
  <div class="r2"><div><label>Проект (сделка)</label><select id="sp_d" onchange="spGen('${cid}')">${opt([['','Все проекты клиента'],...ds.map(d=>[d.id,d.title])],(ds.find(d=>!['won','lost'].includes(d.stage))||[...ds].sort((x,y)=>(y.stageAt||'').localeCompare(x.stageAt||''))[0])?.id||'')}</select></div>
  <div><label>Служебные события</label><select id="sp_a" onchange="spGen('${cid}')"><option value="0">не включать</option><option value="1">включать</option></select></div></div>
  <pre class="spr" id="sp_t" style="margin-top:14px"></pre>
  <div style="display:flex;gap:8px;margin-top:4px"><button class="btn" onclick="navigator.clipboard.writeText(sp_t.innerText).then(()=>toast('Скопировано'))">⧉ Копировать</button><button class="btn" onclick="spWord()">⇩ Word</button></div>`,null);
 spGen(cid);
}
function spGen(cid){
 const c=C(cid),did=v('sp_d'),auto=v('sp_a')==='1';
 const deal=did?D(did):null;
 const ks=S.contracts.filter(k=>k.clientId===cid&&(!did||k.dealId===did||!k.dealId)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const evs=S.events.filter(e=>e.clientId===cid&&(auto||!e.auto)&&(!did||e.dealId===did||!e.dealId)).sort((a,b)=>a.date.localeCompare(b.date));
 let t=deal?`СПРАВКА\nпо проекту «${deal.title}» — ${c.name}\n\n`:`СПРАВКА\nпо клиенту ${c.name}\n\n`;
 if(ks.length)ks.forEach(k=>{t+=`Договор: № ${k.num}${k.date?' от '+fd(k.date):''}, сумма ${money(k.amount)}. Статус: ${KSTAT[k.status].toLowerCase()}.${k.end?' Срок действия до '+fd(k.end)+'.':''}\n`;if(k.subject)t+=`Предмет: ${k.subject}.\n`});
 else t+='Договор: не заключен.\n';
 if(deal)t+=`Текущий этап: ${st(deal.stage).n}${deal.amount?'. Ожидаемая сумма: '+money(deal.amount):''}.\nОтветственный: ${uname(deal.owner)}.\n${deal.paused?`Проект приостановлен с ${fd(deal.paused.at)}. Причина: ${deal.paused.reason}. Возврат к вопросу — ${fd(pauseRemind(deal))}.\n`:''}${spNext(deal)}`;
 t+=`\nХронология:\n`+(evs.map(e=>`${fd(e.date)} — ${e.text}`).join('\n')||'событий нет');
 sp_t.textContent=t.replace(/ё/g,'е');
}
function spNext(d){if(!d.next)return '';const t=d.nextTask&&S.tasks.find(x=>x.id===d.nextTask&&!x.done);const dt=t?t.deadline:d.nextDate;let r='Следующий шаг: '+d.next.replace(/\.$/,'');if(dt)r+=` — до ${fd(dt)}`;if(t&&t.origDeadline&&t.origDeadline!==t.deadline)r+=` (первоначальный срок ${fd(t.origDeadline)})`;return r+'.\n'}
function summaryForm(){
 openModal('Сводная справка по проектам',`<p class="mut small">По всем активным проектам: этап, сумма, ответственный, следующий шаг и последние события.</p>
  <div class="r2"><div><label>Ответственный</label><select id="su_o" onchange="suGen()"><option value="">Все</option>${S.users.filter(u=>u.role!=='guest'&&S.deals.some(d=>d.owner===u.id)).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div><label>Последних событий по проекту</label><select id="su_n" onchange="suGen()"><option>0</option><option>1</option><option selected>2</option><option>3</option></select></div></div>
  <div class="r2"><div><label>Проекты на паузе</label><select id="su_p" onchange="suGen()"><option value="1">включать</option><option value="0">не включать</option></select></div><div><label>Группировка</label><select id="su_g" onchange="suGen()"><option value="stage">по этапам</option><option value="owner">по ответственным</option></select></div></div>
  <pre class="spr" id="su_t" style="margin-top:14px"></pre>
  <div style="display:flex;gap:8px;margin-top:4px"><button class="btn" onclick="navigator.clipboard.writeText(su_t.innerText).then(()=>toast('Скопировано'))">⧉ Копировать</button><button class="btn" onclick="suWord()">⇩ Word</button></div>`,null);suGen();
}
function suData(){const ow=v('su_o'),pz=v('su_p')==='1';return S.deals.filter(d=>!['won','lost'].includes(d.stage)&&(!ow||d.owner===ow)&&(pz||!d.paused)&&(d.stage!=='lead'||d.next||+d.amount))}
function suGen(){
 const ds=suData(),n=+v('su_n'),g=v('su_g');const sum=ds.reduce((a,d)=>a+(+d.amount||0),0);
 const keys=g==='owner'?[...new Set(ds.map(d=>d.owner))]:[...STAGES.slice(0,6).map(x=>x.id),'pause'];
 let t=`СПРАВКА\nо ходе реализации проектов по состоянию на ${fd(TODAY())}\n\nВ работе ${ds.length} ${plural(ds.length,'проект','проекта','проектов')} на общую сумму ${money(sum)}${ds.filter(d=>d.paused).length?`, из них приостановлено: ${ds.filter(d=>d.paused).length}`:''}.\n`;
 let i=0;keys.forEach(k=>{const l=ds.filter(d=>g==='owner'?d.owner===k:(k==='pause'?d.paused:(!d.paused&&d.stage===k)));if(!l.length)return;
  t+=`\n${g==='owner'?uname(k)||'Без ответственного':k==='pause'?'В приостановлении':st(k).n} (${l.length})\n`;
  l.forEach(d=>{i++;t+=`${i}. ${C(d.clientId)?.name} — ${d.title}. ${g==='owner'?'Этап: '+st(d.stage).n+'. ':''}${+d.amount?'Сумма: '+money(d.amount)+'. ':''}${g!=='owner'?'Ответственный: '+uname(d.owner)+'. ':''}${d.paused?`Приостановлен с ${fd(d.paused.at)}: ${d.paused.reason}. Возврат к вопросу — ${fd(pauseRemind(d))}. `:''}${d.close?'Ожидаемое подписание: '+fd(d.close)+'. ':''}\n`;
   if(d.next)t+=`   ${spNext(d).trim()}\n`;
   if(n){S.events.filter(e=>e.dealId===d.id&&!e.auto).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n).reverse().forEach(e=>{t+=`   ${fd(e.date)} — ${e.text}\n`})}
  })});
 su_t.textContent=t;
}
function suWord(){const lines=su_t.innerText.split('\n').map(l=>l?`<p style="margin:0 0 4pt;${/^\s{3}/.test(l)?'margin-left:1cm;font-size:12pt':''}">${esc(l.trim())}</p>`:'<p>&nbsp;</p>').join('');dl(`Сводная_справка_${TODAY()}.doc`,docHead(lines.replace('<p style="margin:0 0 4pt;">СПРАВКА</p>','<p style="text-align:center;font-weight:bold;margin:0">СПРАВКА</p>')),'application/msword');log('Выгрузка сводной справки','')}

function reportForm(){
 if(!canAudit())return toast('Нет прав','bad');
 const d=new Date(TODAY());const ms=[];for(let i=0;i<12;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}
 openModal('Отчет за месяц',`<label>Месяц</label><select id="rp_m" onchange="rpGen()">${ms.map((m,i)=>`<option value="${m}" ${i===(d.getDate()<=10?1:0)?'selected':''}>${monName(m)}${i===0?' (текущий, по сегодняшний день)':''}</option>`).join('')}</select><div id="rp_v" style="margin-top:14px;max-height:55vh;overflow:auto"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="rpWord()">⇩ Word</button></div>`,null);rpGen();
}
function rpCalc(m){
 const inM=x=>x&&x.slice(0,7)===m;const nx=(()=>{const [y,mm]=m.split('-').map(Number);const x=new Date(y,mm,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')})();
 const newC=S.clients.filter(c=>inM(c.createdAt)),newD=S.deals.filter(d=>inM(d.createdAt)&&d.title!=='Первичный контакт'),moves=S.events.filter(e=>e.auto&&inM(e.date)&&/переведена на этап/.test(e.text));
 const won=S.deals.filter(d=>d.stage==='won'&&inM(d.stageAt)),lost=S.deals.filter(d=>d.stage==='lost'&&inM(d.stageAt)),pz=S.deals.filter(d=>d.paused&&inM(d.paused.at));
 const ks=S.contracts.filter(k=>['signed','done'].includes(k.status)&&inM(k.date));const pays=S.contracts.flatMap(k=>(k.pays||[]).filter(x=>x.done&&inM(x.doneAt)).map(x=>({k,x})));
 const tdone=S.tasks.filter(t=>t.done&&inM(t.doneAt)),tok=tdone.filter(t=>t.doneAt<=(t.origDeadline||t.deadline));
 const endM=m===TODAY().slice(0,7)?TODAY():new Date(+m.slice(0,4),+m.slice(5,7),0).toISOString().slice(0,10);
 const tover=S.tasks.filter(t=>t.deadline<endM&&(!t.done||t.doneAt>endM)&&t.createdAt<=endM);
 const ords=(S.orders||[]).filter(o=>inM(o.at)),ordDone=(S.orders||[]).filter(o=>!o.cancelled&&inM(o.doneAt)),ordOver=(S.orders||[]).filter(o=>!o.cancelled&&ordDl(o)<endM&&(!o.doneAt||o.doneAt>endM));
 const ppl=S.users.filter(u=>['owner','admin','super','user'].includes(u.role)&&(u.active||S.deals.some(d=>d.owner===u.id))).map(u=>{const ev=S.events.filter(e=>e.by===u.id&&!e.auto&&inM(e.date));const td=tdone.filter(t=>t.assignee===u.id);return {u,act:S.deals.filter(d=>d.owner===u.id&&!['won','lost'].includes(d.stage)).length,won:won.filter(d=>d.owner===u.id).reduce((a,d)=>a+(+d.amount||0),0),meet:ev.filter(e=>e.type==='meet').length,call:ev.filter(e=>e.type==='call').length,ev:ev.length,td:td.length,ok:td.filter(t=>t.doneAt<=(t.origDeadline||t.deadline)).length}}).filter(x=>x.act||x.ev||x.td||x.won);
 const next=S.deals.filter(d=>!['won','lost'].includes(d.stage)&&!d.paused&&d.close&&d.close.slice(0,7)===nx);
 return {m,nx,newC,newD,moves,won,lost,pz,ks,pays,tdone,tok,tover,ords,ordDone,ordOver,ppl,next};
}
const sumA=l=>l.reduce((a,d)=>a+(+d.amount||0),0);
function rpHtml(r,word){
 const H=(t)=>word?`<p><b>${t}</b></p>`:`<h4 style="margin:16px 0 6px">${t}</h4>`;const P=t=>`<p style="margin:0 0 6pt">${t}</p>`;
 const T=(h,rows)=>rows.length?(word?docTable(h,rows):`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(x=>`<tr>${x.map(y=>`<td>${esc(y)}</td>`).join('')}</tr>`).join('')}</table></div>`):P('—');
 return `${word?`<p style="text-align:center;font-weight:bold;margin:0">ОТЧЕТ</p><p style="text-align:center;font-weight:bold;margin:0 0 12pt">о работе с клиентами за ${monName(r.m)}</p>`:''}
 ${H('1. Основные показатели')}
 ${P(`Новых клиентов и лидов: ${r.newC.length}. Новых сделок: ${r.newD.length}. Переходов по этапам: ${r.moves.length}.`)}
 ${P(`Выиграно: ${r.won.length} (${money(sumA(r.won))}). Отказов: ${r.lost.length} (${money(sumA(r.lost))}). Приостановлено: ${r.pz.length}.`)}
 ${P(`Подписано договоров: ${r.ks.length} на ${money(sumA(r.ks))}. Поступило оплат: ${money(r.pays.filter(p=>p.x.kind==='pay').reduce((a,p)=>a+(+p.x.amount||0),0))}.`)}
 ${P(`Задач выполнено: ${r.tdone.length}${r.tdone.length?`, из них в срок ${Math.round(r.tok.length/r.tdone.length*100)}%`:''}. Просрочено на конец периода: ${r.tover.length}.`)}
 ${(S.orders||[]).length?P(`Поручений выдано: ${r.ords.length}, исполнено: ${r.ordDone.length}, просрочено на конец периода: ${r.ordOver.length}.`):''}
 ${H('2. Выигранные проекты и подписанные договоры')}${T(['Клиент','Проект / договор','Сумма'],[...r.won.map(d=>[C(d.clientId)?.name,d.title,money(d.amount)]),...r.ks.filter(k=>!r.won.some(d=>d.id===k.dealId)).map(k=>[C(k.clientId)?.name,'Договор № '+k.num,money(k.amount)])])}
 ${r.lost.length?H('3. Отказы')+T(['Клиент','Проект','Причина'],r.lost.map(d=>[C(d.clientId)?.name,d.title,d.lostCode||'не выбрана'])):''}
 ${H(`${r.lost.length?4:3}. Работа сотрудников`)}${T(['Сотрудник','Проектов в работе','Встреч','Звонков','Записей в хронологии','Задач выполнено','В срок','Выиграно'],r.ppl.map(x=>[x.u.name,x.act,x.meet,x.call,x.ev,x.td,x.td?Math.round(x.ok/x.td*100)+'%':'—',x.won?money(x.won):'—']))}
 ${H(`${r.lost.length?5:4}. План на ${monName(r.nx)}`)}${r.next.length?T(['Клиент','Проект','Этап','Сумма','Ожидаемое подписание'],r.next.map(d=>[C(d.clientId)?.name,d.title,st(d.stage).n,money(d.amount),fd(d.close)])):P('Ожидаемых подписаний не указано (поле «Ожидаемая дата подписания» в сделке).')}`;
}

/* ================= ПАЛИТРА КОМАНД ================= */
let PI=0,PL=[];
function openPal(){pal.classList.add('on');pov.classList.add('on');palq.value='';palRender();setTimeout(()=>palq.focus(),30)}
function closePal(){pal.classList.remove('on');pov.classList.remove('on')}
function palRender(){
 const q=palq.value.toLowerCase();PI=0;
 const cmds=[...PAGES.filter(p=>p.id&&pageOk(p)).map(p=>({ic:p.ic,n:p.n,k:'раздел',f:()=>go(p.id)})),
  ...(!ro()?[{ic:'+',n:'Новая сделка',k:'команда',f:()=>dealForm()},{ic:'+',n:'Новый клиент / лид',k:'команда',f:()=>clientForm()},{ic:'+',n:'Новая задача',k:'команда',f:()=>taskForm()},{ic:'+',n:'Новый договор',k:'команда',f:()=>contractForm()}]:[]),
  {ic:'◐',n:'Сменить тему',k:'команда',f:toggleTheme},
  ...S.clients.map(c=>({ic:'◎',n:c.name,k:CSTAT[c.status],f:()=>openClient(c.id)})),
  ...S.deals.map(d=>({ic:'▤',n:d.title+' · '+(C(d.clientId)?.name||''),k:st(d.stage).n,f:()=>openClient(d.clientId)})),...(S.kb?.articles||[]).map(a=>({ic:'❖',n:a.title,k:'база знаний',f:()=>kbShow(a.id)}))];
 PL=cmds.filter(c=>!q||c.n.toLowerCase().includes(q)).slice(0,12);
 palr.innerHTML=PL.map((c,i)=>`<div class="pr ${i===PI?'on':''}" onclick="palRun(${i})"><span>${c.ic}</span>${esc(c.n)}<span class="k">${esc(c.k)}</span></div>`).join('')||'<div class="empty">Ничего не найдено</div>';
}
function palKey(e){if(e.key==='ArrowDown'){PI=Math.min(PL.length-1,PI+1);e.preventDefault()}else if(e.key==='ArrowUp'){PI=Math.max(0,PI-1);e.preventDefault()}else if(e.key==='Enter'){palRun(PI);return}else if(e.key==='Escape'){closePal();return}else return;
 [...palr.children].forEach((x,i)=>x.classList.toggle('on',i===PI))}
function palRun(i){const c=PL[i];closePal();c?.f()}
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'||(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='л'){if(ME){e.preventDefault();openPal()}}
 if(e.key==='Escape'){closeModal();closeDrawer();closePal();umClose();document.body.classList.remove('navon')}
 if(!ME||e.ctrlKey||e.metaKey||e.altKey)return;const tg=e.target;if(tg&&(tg.closest('input,textarea,select,[contenteditable]')))return;
 if(document.getElementById('modal').classList.contains('on')||document.getElementById('pal')?.classList.contains('on'))return;
 const k=e.code;const act={KeyN:()=>!ro()&&dealForm(),KeyT:()=>!ro()&&taskForm(),KeyC:()=>!ro()&&clientForm(),KeyE:()=>CUR&&document.getElementById('drawer').classList.contains('on')&&!ro()&&eventForm(CUR),Slash:()=>openPal(),Digit1:()=>go(ro()?'dash':'my'),Digit2:()=>go('dash'),Digit3:()=>go('pipe'),Digit4:()=>go('clients'),Digit5:()=>go('tasks'),Digit6:()=>go('orders')}[k];
 if(e.key==='?'||(k==='Slash'&&e.shiftKey)){e.preventDefault();return hotHelp()}
 if(act){e.preventDefault();act()}
});
function hotHelp(){openModal('Горячие клавиши',`<div class="list">${[['N','новая сделка'],['T','новая задача'],['C','новый клиент / лид'],['E','событие в хронологию (в открытой карточке клиента)'],['/ или Ctrl+K','поиск и команды'],['1 … 6','Мой день, Дашборд, Воронка, Клиенты, Задачи, Поручения'],['Esc','закрыть окно; отменить перетаскивание'],['?','эта подсказка']].map(([a,b])=>`<div class="it"><span class="kbd" style="min-width:90px;text-align:center">${a}</span><span>${b}</span></div>`).join('')}</div><p class="mut small" style="margin-top:10px">Клавиши работают в любой раскладке, когда курсор не стоит в поле ввода.</p>`,null)}

  ${ns.some(n=>!n.read)?'<div style="margin-top:12px"><button class="btn sm" onclick="notesRead()">Отметить все прочитанными</button></div>':''}`,null);

function noteGo(id){const n=(S.notes||[]).find(x=>x.id===id);if(!n)return;n.read=true;save();closeModal();const l=n.link||{};if(l.client){go(PAGE);openClient(l.client)}else if(l.page)go(l.page);else render()}
function toast(t,k=''){const d=document.createElement('div');d.className='tst '+k;d.textContent=t;document.getElementById('toast').appendChild(d);setTimeout(()=>d.remove(),2600)}
function toggleTheme(){const l=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=l?'':'light';try{localStorage.setItem('dsrc_theme',l?'':'light')}catch(e){}}
try{document.documentElement.dataset.theme=localStorage.getItem('dsrc_theme')||''}catch(e){}
